<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周教瘦康复工作台</title>
<style>
:root{
  --bg:#f0f5fc; --card:#ffffff; --accent:#3b82f6; --accent-d:#2563eb; --accent-l:#eff6ff;
  --text:#2c3e50; --text-2:#5b6b7c; --text-3:#8fa0b3; --border:#dce6f5; --border-2:#e8eff9;
  --danger:#ef4444; --danger-l:#fef2f2; --warn:#f59e0b; --warn-l:#fffbeb;
  --ok:#10b981; --ok-l:#ecfdf5; --purple:#8b5cf6; --purple-l:#f5f3ff;
  --side-h:#4f46e5; --radius:12px;
  --shadow:0 1px 3px rgba(30,60,110,.06),0 6px 18px rgba(30,60,110,.05);
  --shadow-lg:0 12px 40px rgba(25,50,100,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c4d4ec;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}

/* ================= 侧边栏 ================= */
.sidebar{
  width:232px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#4f6ef7 0%,#5b7cf9 55%,#6d8ffb 100%);
  color:#eaf0ff;
}
.side-head{padding:17px 16px 14px;border-bottom:1px solid rgba(255,255,255,.16)}
.side-head .brand{display:flex;align-items:center;gap:10px}
.side-head .logo{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;
}
.side-head h1{font-size:15.5px;font-weight:700;color:#fff;letter-spacing:.3px;line-height:1.3}
.side-head .ver{font-size:10.5px;color:#c6d4ff;margin-top:1px}
.side-disclaimer{font-size:10.5px;color:#bccbff;margin-top:9px;display:flex;align-items:center;gap:5px}
.side-disclaimer svg{width:12px;height:12px;stroke:#bccbff;flex-shrink:0}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 10px 14px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25)}

.region-item{margin-bottom:3px}
.region-toggle{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  color:#e6ecff;font-size:13.5px;text-align:left;transition:.16s;font-weight:500;
}
.region-toggle:hover{background:rgba(255,255,255,.12)}
.region-toggle .arrow{
  width:12px;height:12px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2.4;
  transition:transform .2s;opacity:.75;
}
.region-item.open > .region-toggle .arrow{transform:rotate(90deg)}
.region-item.open > .region-toggle{background:rgba(255,255,255,.16);color:#fff}
.region-toggle .ricon{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sub-list{display:none;padding:2px 0 4px 26px}
.region-item.open > .sub-list{display:block}
.sub-toggle{
  width:100%;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;
  font-size:12.8px;color:#d3ddff;text-align:left;transition:.14s;font-weight:400;
}
.sub-toggle:hover{background:rgba(255,255,255,.1);color:#fff}
.sub-toggle.active{background:rgba(255,255,255,.22);color:#fff;font-weight:600}
.sub-toggle .sicon{font-size:12.5px;width:18px;text-align:center;flex-shrink:0}
.disease-group{margin:1px 0}
.disease-toggle{
  width:100%;display:flex;align-items:center;gap:8px;padding:5.5px 9px;border-radius:7px;
  font-size:12.5px;color:#ccd8ff;text-align:left;transition:.14s;
}
.disease-toggle:hover{background:rgba(255,255,255,.1);color:#fff}
.disease-toggle.active{background:rgba(255,255,255,.22);color:#fff;font-weight:600}
.disease-toggle .cnt{
  margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.18);padding:0 7px;
  border-radius:9px;line-height:17px;font-weight:600;
}
.disease-list{display:none;padding:2px 0 2px 20px}
.disease-group.open > .disease-list{display:block}
.disease-link{
  display:block;width:100%;padding:5px 9px;border-radius:6px;font-size:12.3px;color:#c3d0fb;
  text-align:left;transition:.13s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.disease-link:hover{background:rgba(255,255,255,.1);color:#fff}
.disease-link.active{background:rgba(255,255,255,.24);color:#fff;font-weight:600}
.side-foot{
  padding:11px 16px;border-top:1px solid rgba(255,255,255,.16);
  font-size:10.5px;color:#b7c6fa;text-align:center;letter-spacing:.5px;
}

/* ================= 主区 ================= */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  background:#fff;border-bottom:1px solid var(--border);height:58px;flex-shrink:0;
  display:flex;align-items:center;gap:14px;padding:0 22px;position:relative;z-index:40;
}
.menu-btn{display:none;width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;flex-shrink:0}
.menu-btn svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round}
.crumb{font-size:13.5px;color:var(--text-2);display:flex;align-items:center;gap:7px;min-width:0}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{color:var(--text-3)}
.crumb .cur{color:var(--accent);font-weight:600}
.topbar .spacer{flex:1}
.btn-reset{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;
  background:var(--accent-l);color:var(--accent-d);font-size:12.8px;font-weight:600;
  border:1px solid #d6e4fb;transition:.16s;flex-shrink:0;
}
.btn-reset:hover{background:#dbeafe}
.btn-reset svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.content{flex:1;overflow-y:auto;padding:24px 28px 48px}
.tab-nav{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{
  padding:8px 16px;border-radius:9px;font-size:13.2px;font-weight:500;color:var(--text-2);
  background:#fff;border:1px solid var(--border);transition:.16s;
}
.tab-btn:hover{border-color:var(--accent);color:var(--accent)}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(59,130,246,.3)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.card-head{padding:14px 18px 12px;display:flex;align-items:center;gap:9px}
.card-head .cicon{font-size:16px}
.card-head h3{font-size:14.5px;font-weight:700}
.card-head .cnt-tag{font-size:11.5px;background:var(--accent-l);color:var(--accent-d);padding:1px 9px;border-radius:10px;font-weight:600}
.card-body{padding:0 18px 16px;overflow-x:auto}
.card-note{padding:10px 18px 14px;font-size:12.8px;color:var(--text-2);border-top:1px dashed var(--border-2);margin-top:4px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{text-align:left;padding:9px 12px;font-size:11.8px;font-weight:600;color:var(--text-2);background:#f6f9fe;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border-2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td .en{color:var(--text-3);font-size:11.5px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag-blue{background:var(--accent-l);color:var(--accent-d)}
.tag-purple{background:var(--purple-l);color:var(--purple)}
.tag-red{background:var(--danger-l);color:var(--danger)}
.tag-orange{background:var(--warn-l);color:#b45309}
.tag-green{background:var(--ok-l);color:#059669}
.tag-gray{background:#eef2f8;color:var(--text-2)}

/* 首页 */
.home-hero{text-align:center;padding:110px 20px 40px}
.home-hero-clean .big{font-size:58px;margin-bottom:20px}
.home-hero-clean h2{font-size:20px;font-weight:700;margin-bottom:10px;color:var(--text)}
.home-hero-clean p{font-size:13.5px;color:var(--text-3)}
.home-hero-clean .home-prog{margin-top:26px;font-size:12.5px;color:var(--text-3)}
.home-prog b{color:var(--accent-d)}
.home-card{
  background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 16px;
  cursor:pointer;transition:.18s;text-align:center;
}
.home-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#c3d7f8}
.home-card .hc-icon{width:46px;height:46px;border-radius:12px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:23px}
.home-card b{font-size:14px;display:block}
.home-card span{font-size:11.5px;color:var(--text-3);display:block;margin-top:3px}

/* 疾病分类卡 / 病种卡 */
.cat-grid,.d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.cat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:.18s}
.cat-card:hover{box-shadow:var(--shadow-lg);border-color:#c3d7f8;transform:translateY(-2px)}
.cat-card .cc-icon{font-size:26px;margin-bottom:10px}
.cat-card b{font-size:14.5px;display:block}
.cat-card .cc-sub{font-size:11.8px;color:var(--text-3);margin-top:3px}
.cat-card .cc-link{font-size:12.3px;color:var(--accent);font-weight:600;margin-top:12px;display:block}
.d-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 17px;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.d-card:hover{box-shadow:var(--shadow-lg);border-color:#c3d7f8;transform:translateY(-2px)}
.d-card b{font-size:14px}
.d-card .alias{font-size:11.8px;color:var(--text-3);margin-top:2px}
.d-card .d-sub{font-size:12.3px;color:var(--text-2);margin-top:9px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d-card .d-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}

/* 页头说明 */
.page-head{margin-bottom:20px}
.page-head h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.page-head .ph-sub{font-size:13px;color:var(--text-2);margin-top:5px}

/* 病种详情 */
.dx-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.dx-box h4{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dx-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.dx-item{display:flex;gap:9px;font-size:13px;color:var(--text-2);line-height:1.6}
.dx-item .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:8px}
.phase-card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.phase-head{
  padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(90deg,#f5f9ff,#fff);border-bottom:1px solid var(--border);
}
.phase-num{
  width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.phase-head b{font-size:14.5px}
.phase-head .ph-dur{font-size:11.8px;color:var(--text-3)}
.phase-head .spacer{flex:1}
.phase-goal{font-size:12.6px;color:var(--text-2);padding:11px 18px;background:#fafcff;border-bottom:1px solid var(--border-2);display:flex;gap:8px}
.phase-goal .glabel{color:var(--accent-d);font-weight:600;flex-shrink:0}
.ex-item{padding:14px 18px;border-bottom:1px solid var(--border-2)}
.ex-item:last-child{border-bottom:none}
.ex-head{display:flex;align-items:flex-start;gap:11px}
.ex-check{
  width:21px;height:21px;border-radius:6px;border:2px solid #c6d6ee;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff;
}
.ex-check:hover{border-color:var(--accent)}
.ex-check.done{background:var(--ok);border-color:var(--ok)}
.ex-check svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ex-check.done svg{opacity:1}
.ex-main{flex:1;min-width:0}
.ex-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ex-title b{font-size:13.8px;cursor:pointer}
.ex-item.done-ex .ex-title b{color:var(--text-3);text-decoration:line-through}
.ex-meta{display:flex;gap:6px;flex-wrap:wrap}
.ex-desc{font-size:12.8px;color:var(--text-2);margin-top:7px}
.ex-steps{margin-top:9px;background:#f8fbff;border-radius:9px;padding:10px 13px}
.ex-steps .st-label{font-size:11.3px;font-weight:700;color:var(--accent-d);margin-bottom:6px;letter-spacing:.5px}
.ex-steps li{font-size:12.5px;color:var(--text-2);margin:3px 0 3px 16px;line-height:1.55}
.warn-box{background:var(--danger-l);border:1px solid #fecaca;border-radius:12px;padding:15px 18px;margin-bottom:16px}
.warn-box h4{color:var(--danger);font-size:13.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.warn-box li{font-size:12.8px;color:#991b1b;margin:4px 0 4px 18px;line-height:1.6}
.tips-box{background:var(--ok-l);border:1px solid #a7f3d0;border-radius:12px;padding:15px 18px;margin-bottom:16px}
.tips-box h4{color:#059669;font-size:13.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.tips-box li{font-size:12.8px;color:#065f46;margin:4px 0 4px 18px;line-height:1.6}

/* 进度环 */
.prog-wrap{display:flex;align-items:center;gap:8px}
.prog-ring{width:34px;height:34px}
.prog-txt{font-size:11.5px;color:var(--text-2);line-height:1.3}
.prog-txt b{font-size:13px;color:var(--text)}

/* 评定特殊试验 */
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.st-card{background:#f8fbff;border:1px solid var(--border-2);border-radius:10px;padding:13px 15px}
.st-card b{font-size:13.3px}
.st-card .st-cn{font-size:12px;color:var(--accent-d);font-weight:600}
.st-card p{font-size:12.5px;color:var(--text-2);margin-top:6px}
.st-card .st-ind{font-size:11.8px;color:var(--danger);margin-top:7px;display:flex;gap:6px;align-items:flex-start}
.st-card .st-ind svg{width:13px;height:13px;stroke:var(--danger);flex-shrink:0;margin-top:2px;fill:none;stroke-width:2}
.ill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.ill-legend{
  display:flex;gap:18px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;
  background:#f4f8ff;border:1px solid var(--border-2);border-radius:9px;font-size:12.3px;color:var(--text-2);
}
.ill-legend span{display:flex;align-items:center;gap:6px}
.ill-legend .lg-line{width:22px;height:0;border-top:2.5px dashed #9db3c8}
.ill-legend .lg-arc{width:22px;height:10px}
.ill-legend .lg-res{width:22px;height:0;border-top:3px solid var(--danger);position:relative}
.ill-legend .lg-res::after{content:'';position:absolute;right:-1px;top:-4px;border:4px solid transparent;border-left-color:var(--danger)}
.ill-card{background:#f8fbff;border:1px solid var(--border-2);border-radius:10px;padding:11px 11px 12px}
.ill-card .ill-svg{width:100%;height:100px;display:block;background:#fff;border-radius:8px;border:1px solid var(--border-2)}
.ill-card b{font-size:13px}
.ill-card .en{font-size:11px;color:var(--text-3);font-weight:400}
.ill-card .ill-test{font-size:12px;color:var(--text-2);margin-top:5px;line-height:1.55}
.ill-card .ill-range{font-size:12px;margin-top:5px}
.ill-card .ill-range b{color:var(--accent-d)}
.ill-card .tag{margin-top:6px}
.st-links{display:flex;gap:8px;margin-top:10px}
.st-links a{
  font-size:11.8px;padding:4px 11px;border-radius:7px;background:var(--accent-l);
  color:var(--accent-d);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;
}
.st-links a:hover{background:#dbeafe}
.st-links a.img{background:var(--warn-l);color:#b45309}
.st-links a.img:hover{background:#fde68a}

.empty-tip{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-tip .e-icon{font-size:44px;margin-bottom:12px}
.empty-tip p{font-size:13.5px}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);
  background:#1e293b;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow-lg);z-index:900;opacity:0;transition:.3s;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* mask */
.confirm-mask{position:fixed;inset:0;background:rgba(20,35,60,.45);display:none;align-items:center;justify-content:center;z-index:800;padding:20px}
.confirm-mask.show{display:flex}
.confirm-box{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);max-width:360px;width:100%;padding:24px;text-align:center}
.confirm-box .c-icon{font-size:36px;margin-bottom:12px}
.confirm-box h4{font-size:15.5px;margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--text-2);margin-bottom:20px}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:10px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.15s}
.confirm-btns .c-no{background:#eef2f8;color:var(--text-2)}
.confirm-btns .c-no:hover{background:#e2e9f4}
.confirm-btns .c-yes{background:var(--danger);color:#fff}
.confirm-btns .c-yes:hover{background:#dc2626}

@media(max-width:920px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:500;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .menu-btn{display:flex}
  .content{padding:16px 14px 44px}
  .home-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .cat-grid,.d-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .dx-list{grid-template-columns:1fr}
}
.side-backdrop{position:fixed;inset:0;background:rgba(15,30,55,.4);z-index:490;display:none}
.side-backdrop.show{display:block}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand">
        <div class="logo">🏥</div>
        <div>
          <h1>周教瘦康复工作台</h1>
          <div class="ver">v5.0</div>
        </div>
      </div>
      <div class="side-disclaimer">
        <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        仅供参考 · 请遵医嘱
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="side-foot">周教瘦康复工作台 · v5.0</div>
  </aside>
  <div class="side-backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="crumb" id="breadcrumb"></div>
      <div class="spacer"></div>
      <button class="btn-reset" onclick="askReset()">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4M3 4v5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>

"日常活动和睡眠时佩戴"]},{"n":"冰敷","s":"每2-3小时","r":"15分钟","d":"冰敷腕桡侧痛处。","st":["毛巾包裹冰袋","敷于腕桡侧疼痛区域","每次15分钟"]},{"n":"对侧手代偿","s":"日常","r":"—","d":"暂停患侧拧毛巾、抱孩子、玩手机。","st":["用健侧手完成精细动作","避免拇指反复外展和伸"]}]},{"n":2,"t":2,"d":"恢复期2-4周","g":"恢复肌腱滑动和柔韧性。","ex":[{"n":"拇指肌腱滑动","s":"3次/日","r":"10次/组","d":"无痛范围做拇指屈伸和外展内收。","st":["手腕中立位","缓慢做拇指屈曲和伸展","再缓慢做拇指外展和内收"]},{"n":"腕桡侧拉伸","s":"3次/日","r":"保持30秒×3次","d":"手臂前伸拇指内收握拳，缓慢将手腕向尺侧偏。","st":["手臂前伸拇指握于拳内","缓慢将手腕向尺侧偏","保持30秒"]},{"n":"等长收缩训练","s":"2组/日","r":"10次/组","d":"拇指对抗另一手阻力但不移动。","st":["手腕中立位","拇指轻对抗另一手阻力","保持5秒放松"]}]}],"warnings":["急性期必须严格制动","Finkelstein试验阳性是典型体征","保守无效可考虑局部封闭（≤2次）"]}},"trauma":{"distalPhalanxFx":{"name":"远节指骨骨折","alias":"末节指骨骨折 / 锤状指（Mallet Finger）","dx":["手指末节（最远端指节）疼痛、肿胀、淤血或甲下血肿","手指末节屈曲畸形、主动伸直不能（锤状指畸形）","X线正侧位明确骨折类型：单纯撕脱骨折/横形骨折/粉碎骨折/累及关节面","常见损伤机制：指尖轴向撞击（如被球砸中）、屈曲暴力致伸肌腱止点撕脱","开放性骨折需注意甲床损伤和感染风险"],"sub":"远节指骨骨折是手部最常见骨折之一。由于伸肌腱终末腱止于此，常合并伸肌腱损伤导致锤状指畸形。康复重点是保护伸肌腱愈合、恢复远侧指间关节（DIP）伸直功能和精细触觉。","tags":[{"t":"锤状指","c":"warn"},{"t":"伸肌腱保护","c":"danger"},{"t":"分3阶段","c":"accent"}],"phases":[{"n":1,"t":"第0-6周（严格固定期）","d":"伤后/术后0-6周","g":"DIP关节严格固定于伸直位（或轻度过伸位），保护骨折愈合和伸肌腱止点。固定期间绝对不能屈曲DIP关节。","ex":[{"n":"DIP关节伸直位固定","s":"24小时/日","r":"持续6-8周","d":"使用Stack夹板或铝条夹板将远侧指间关节固定于完全伸直位（0°或轻度过伸5-10°）。这是锤状指和远节骨折最关键的保守治疗措施。","st":["夹板固定DIP关节于伸直位","24小时佩戴（包括睡觉和洗澡）","更换夹板时保持手指伸直不动","近侧指间关节（PIP）不固定可自由活动","如皮肤出现压红/破损需及时调整"]},{"n":"PIP关节主动屈伸","s":"3-4组/日","r":"15-20次/组","d":"在DIP固定的前提下，主动屈伸近侧指间关节（PIP）和掌指关节（MCP），防止邻近关节僵硬。","st":["保持DIP伸直位不动","缓慢屈曲PIP关节到最大范围","缓慢伸直PIP关节","同时可活动掌指关节","动作轻柔避免牵动末节"]},{"n":"健指/手腕/肘肩活动","s":"3组/日","r":"各方向15次","d":"活动未受伤的手指、手腕、肘关节和肩关节，防止上肢因制动导致关节僵硬。","st":["主动活动健侧四指做握拳和伸展","腕关节屈伸和旋转","肘关节屈伸","肩关节各方向活动"]},{"n":"患肢抬高","s":"持续","r":"高于心脏水平","d":"卧位和坐位时将患手抬高，促进静脉回流减轻肿胀。可用枕头垫高或用三角巾悬吊。","st":["坐位时患手放在对侧肩上或桌面上","卧位时患手垫在枕头上","避免患手长时间下垂","尤其在伤后1-2周"]}]},{"n":2,"t":"第6-10周（活动恢复期）","d":"伤后/术后6-10周","g":"经X线确认骨折愈合后，逐步开始DIP关节活动度训练。此阶段仍需夜间佩戴伸直位夹板保护。","ex":[{"n":"DIP关节主动屈伸","s":"3-5组/日","r":"10-15次/组","d":"取下夹板后主动缓慢屈曲和伸直DIP关节，在无痛范围内活动。初期幅度小、速度慢。","st":["取下夹板","缓慢屈曲末节手指到无痛最大范围","保持3秒","缓慢伸直末节手指","保持3秒","如伸不直属正常逐步改善"]},{"n":"DIP被动辅助屈伸","s":"2-3组/日","r":"10次/组","d":"用健侧手轻轻辅助患指末节做被动屈伸，注意动作极其轻柔避免暴力。","st":["健侧手拇指和食指捏住患指末节","极其轻柔地辅助屈曲末节","再轻柔辅助伸直","全程无痛如疼痛立即停止","训练前后热敷5分钟有助于放松"]},{"n":"夜间伸直夹板","s":"每晚","r":"持续至第12周","d":"白天训练后夜间继续佩戴伸直位夹板，防止伸肌腱在睡眠中意外屈曲导致再损伤。","st":["睡前佩戴伸直夹板","确保DIP完全伸直","次日早晨取下","持续至第12周或遵医嘱"]},{"n":"手指精细活动","s":"2-3组/日","r":"5-10分钟","d":"用患指做捏豆子、捡米粒、翻书页等精细动作，恢复指尖触觉和协调性。","st":["准备一碗黄豆/绿豆","用患指拇指对捏捡起豆子","放入另一碗中","也可练习翻书页、按按钮","逐步增加难度"]},{"n":"抓握弹力球（轻柔）","s":"2组/日","r":"10次/组","d":"使用超软弹力球做轻柔抓握，激活手内在肌和屈肌腱。注意避免末节过度受力。","st":["选择超软弹力球","轻柔抓握以手掌和近节发力为主","末节自然跟随不单独用力","每次10次避免疲劳"]}]},{"n":3,"t":"第10周+（功能强化期）","d":"伤后/术后10周以后","g":"全面恢复手指功能，强化握力和捏力，恢复日常精细操作能力。夜间夹板逐步停用。","ex":[{"n":"全指综合屈伸训练","s":"3-4组/日","r":"15次/组","d":"患指从完全伸直位缓慢握拳再到完全伸直，训练全指协调运动。","st":["手指完全伸直","缓慢握拳拇指在外","保持3秒","缓慢完全伸直手指","动作流畅控制速度"]},{"n":"捏力训练","s":"2-3组/日","r":"10-15次/组","d":"患指与拇指对捏弹力橡皮泥、衣夹或捏力器，强化指尖捏力。","st":["使用软橡皮泥或衣夹","拇指与患指末节对捏","保持3秒后放松","逐步增加阻力","避免过度用力"]},{"n":"握力训练","s":"2-3组/日","r":"10次/组","d":"使用握力球或可调握力器训练全手握力，注意患指参与但不单独过度负荷。","st":["选择低阻力握力器","五指均匀用力握紧","保持3秒缓慢放松","逐步增加阻力"]},{"n":"ADL模拟训练","s":"日常","r":"—","d":"模拟日常生活动作：写字、扣纽扣、用筷子、拧瓶盖、使用手机键盘等。","st":["从简单动作开始（写字、按键）","逐步增加难度（扣纽扣、系鞋带）","再增加力量要求（拧瓶盖、用剪刀）","每次10-15分钟","以不引起疼痛为度"]},{"n":"感觉脱敏训练","s":"2组/日","r":"5-10分钟","d":"用不同质地材料（棉花、毛巾、砂纸、豆子）触碰患指末节，恢复指尖感觉功能。","st":["准备不同质地的材料","从柔软（棉花）开始触碰指尖","逐步到粗糙（毛巾→砂纸）","闭眼辨识不同质地","如有感觉过敏需更轻柔"]}]}],"warnings":["固定期间DIP关节绝对不能屈曲——即使一次意外屈曲也可能导致伸肌腱愈合失败","更换夹板时必须始终保持手指伸直位（可请他人协助）","锤状指保守治疗的伸直夹板需严格24h佩戴6-8周，之后夜间佩戴至12周","如为开放性骨折或累及关节面>30%，通常需手术治疗（克氏针/螺钉内固定）","残留10°-15°伸直受限是常见的（尤其陈旧性损伤），不影响大部分日常功能","甲下血肿>50%或伴甲根损伤需行甲板开窗减压或甲床修复","过早停止夜间夹板保护是导致锤状指复发的首要原因"],"tips":["洗澡时用防水套保护夹板，或选择可湿水的热塑夹板","拆除固定后手指皮肤干燥脱屑属正常，温水浸泡+润肤霜可改善","合并甲床损伤者指甲可能需要3-6个月重新生长完整","训练前温水泡手5-10分钟可软化瘢痕、减轻僵硬","术后克氏针通常4-6周拔除，拔针后即可开始活动度训练","末节伸直功能恢复比屈曲更难，伸直训练需更有耐心","伤后3个月如伸直仍明显受限（>30°），可考虑康复科关节松动治疗"]},"metacarpalBaseFx":{"name":"掌骨基底骨折","alias":"第一掌骨基底部骨折 / Bennett骨折 / Rolan 裂","神经系统查体需完整记录ASIA分级(ASIA Impairment Scale A-E)，注意感觉平面和运动关键肌肌力评估","需鉴别强直性脊柱炎合并颈椎骨折（低能量损伤即可发生，易漏诊，需全脊柱CT）"],"sub":"颈椎骨折指颈椎椎体及附件的骨结构连续性中断，以下颈椎(C3-C7)多见。常见损伤机制包括屈曲压缩导致楔形/爆裂骨折、过伸导致牵张损伤、轴向载荷导致Jefferson/Jefferson样骨折。骨折可合并脊髓损伤，是创伤致瘫的重要原因。治疗需根据骨折稳定性、神经损伤程度及AO Spine分型决定保守或手术方案。保守治疗以颈托或Halo架严格制动8-12周为核心；不稳定骨折或合并神经损伤者需行前路/后路/前后路联合手术。康复贯穿制动期至功能恢复，强调颈椎稳定性的全程维护和渐进式功能重建。","tags":[{"t":"脊柱创伤","c":"danger"},{"t":"颈托制动","c":"warn"},{"t":"下颈椎骨折","c":"accent"},{"t":"神经损伤风险","c":"danger"},{"t":"渐进康复","c":"purple"}],"phases":[{"n":1,"t":"第0-8周（严格制动期）","d":"伤后/术后0-8周","g":"维护颈椎稳定性，预防并发症（深静脉血栓、肺部感染、压疮、肌肉萎缩），控制疼痛，保护神经功能，为骨折愈合创造最佳力学环境","ex":[{"n":"踝泵运动","s":"每1-2小时","r":"30次/组","d":"仰卧位下踝关节主动屈伸，促进下肢静脉回流，预防深静脉血栓形成","st":["仰卧于床面，双腿自然伸直，全身放松","缓慢用力勾脚尖（踝背屈）至最大幅度，保持3秒","缓慢用力绷脚尖（踝跖屈）至最大幅度，保持3秒","以踝关节为轴心做顺时针和逆时针环绕各10次","双踝同时进行，每1-2小时完成一组30次"]},{"n":"股四头肌等长收缩","s":"每日3组","r":"15次/侧","d":"仰卧位下股四头肌静力性收缩，维持下肢肌力，防止失用性萎缩","st":["仰卧，膝下垫一小毛巾卷使膝关节微屈约15°","大腿前方肌肉（股四头肌）用力收紧，感觉髌骨向上移动","保持最大收缩5秒，期间正常呼吸不憋气","缓慢放松5秒，完成一次","双侧交替进行，每侧完成15次为一组"]},{"n":"上肢握力球训练","s":"每日3组","r":"20次/侧","d":"使用软握力球进行手部抓握训练，维持前臂和手内肌功能","st":["仰卧或半卧位，上肢自然放于体侧","将软握力球置于掌心，五指均匀用力缓慢握紧","握至最大程度后保持3秒","缓慢松开至手指完全伸展，休息2秒","双侧交替，每侧完成20次"]},{"n":"腹式呼吸训练","s":"每日4组","r":"10次/组","d":"腹式深呼吸促进肺扩张，预防坠积性肺炎，同时避免颈部和上胸廓过度活动","st":["仰卧屈膝位，一手放于腹部，一手放于胸前","用鼻缓慢深吸气，感受腹部隆起（胸前手不动）","吸气至最大程度后屏气2秒","经口缓慢呼气，嘴唇微缩如吹蜡烛，感受腹部下沉","呼气时间约为吸气时间的2倍，循环10次"]},{"n":"臀肌等长收缩","s":"每日3组","r":"15次/组","d":"仰卧位下臀肌静力性收缩，维持髋周肌力，预防骶尾部压疮","st":["仰卧，双腿自然伸直","双侧臀肌同时用力夹紧，感觉臀部肌肉收紧","保持最大收缩5秒，正常呼吸","缓慢放松5秒","重复15次为一组"]}]},{"n":2,"t":"第8-12周（活动恢复期）","d":"伤后/术后8-12周","g":"在颈托保护下逐步恢复颈椎无痛范围的主动活动，开始颈部深屈肌激活训练，改善日常生活活动能力，继续四肢肌力维持训练","ex":[{"n":"颈椎等长抗阻训练（多方向）","s":"每日2组","r":"每个方向5次","d":"在颈托摘除后（需影像学确认骨折愈合），用手掌提供轻微阻力进行颈椎各方向等长收缩训练","st":["坐位或站立位，颈椎中立位，目视前方","前屈训练：手掌抵住前额，颈部向前用力与手掌对抗，保持5秒","后伸训练：双手交叉置于枕后，颈部向后用力与手掌对抗，保持5秒","侧屈训练：手掌抵住同侧颞部，颈部侧屈用力与手掌对抗，保持5秒，左右交替","旋转训练：手掌抵住同侧颞部前方，颈部旋转用力与手掌对抗，保持5秒，左右交替"]},{"n":"颈深屈肌激活（收下巴训练）","s":"每日3组","r":"10次/组","d":"训练颈深屈肌群（头长肌、颈长肌），纠正头前伸姿势，建立颈椎节段性稳定控制","st":["仰卧位，膝下垫枕，头下垫薄毛巾使头颈处于中立舒适位","眼睛注视天花板，想象头顶有一根线向上轻轻牵拉","缓慢做收下巴动作，感觉枕部轻轻向床面施压（如点头说\"是\"）","保持收下巴位5-10秒，颈部后侧有轻微牵拉感","缓慢放松回起始位，过程中避免颈前侧肌肉（胸锁乳突肌）过度隆起"]},{"n":"肩胛骨回缩训练","s":"每日3组","r":"12次/组","d":"激活中下斜方肌和菱形肌，改善上交叉姿势，为颈部康复提供良好的肩带基础","st":["坐位或站立位，双臂自然下垂","双侧肩胛骨向脊柱中线方向缓慢内收（想象肩胛骨之间夹一支笔）","保持肩胛骨回缩位5秒，双肩勿耸肩","缓慢放松，恢复肩胛骨自然位置","重复12次为一组"]},{"n":"颈椎无痛主动活动度训练","s":"每日2组","r":"每个方向5次","d":"在无痛范围内进行颈椎各方向缓慢主动活动，维持关节活动度，以不引起疼痛为度","st":["坐位，颈椎中立位，目视前方，全程动作缓慢可控","缓慢低头（颈椎屈曲），至无痛最大范围即停，保持3秒后回位","缓慢仰头（颈椎后伸），至无痛最大范围即停，保持3秒后回位","缓慢向左/向右转头（旋转），至无痛最大范围即停，保持3秒后回位","缓慢向左/向右侧屈，至无痛最大范围即停，保持3秒后回位"]},{"n":"上肢弹力带划船训练（低阻力）","s":"每日2组","r":"12次/组","d":"使用最低阻力弹力带进行划船动作，强化上背部肌群，维持上肢功能","st":["坐位，将弹力带固定于前方约胸高处","双手握住弹力带两端，肘关节屈曲，肩胛骨后收带动手臂向后拉","拉至肘关节越过躯干侧方，肩胛骨完全回缩，保持2秒","缓慢控制弹力带回弹至起始位","全程保持颈部中立，避免头前伸代偿"]}]},{"n":3,"t":"第12-16周（肌力强化期）","d":"伤后/术后12-16周","g":"系统强化颈部及肩带上肢肌力，提高颈椎动态稳定性，逐步恢复日常生活和工作能力，纠正不良姿势习惯","ex":[{"n":"弹力带颈部多方向抗阻训练","s":"每日2组","r":"每个方向8-10次","d":"使用弹力带进行颈部各方向动态抗阻训练，渐进增加颈部肌群力量和耐力","st":["坐位，弹力带固定于头后方适宜高度","前屈抗阻：弹力带置于前额，缓慢低头对抗弹力带阻力，离心回位","后伸抗阻：弹力带置于枕后，缓慢仰头对抗阻力","侧屈抗阻：弹力带置于颞部，缓慢侧屈对抗阻力","全程动作缓慢可控(2秒向心/4秒离心)，以不诱发疼痛为准"]},{"n":"四点跪位颈部稳定性训练","s":"每日2组","r":"保持30秒×5次","d":"四点跪位下进行颈部节段性稳定训练，整合核心与颈椎控制","st":["四点跪位于垫上，双手与肩同宽，双膝与髋同宽","收腹、收下巴使头颈与躯干保持一条直线","保持该姿势30秒，期间正常呼吸","进阶：在保持姿势同时，缓慢抬起一侧上肢前伸，保持10秒后换侧","全程保持颈部中立，避免塌腰或弓背"]},{"n":"TheraBand肩袖肌群训练","s":"每日2组","r":"12次/侧","d":"使用TheraBand进行肩关节内外旋训练，强化肩袖肌群，改善肩颈联动功能","st":["站立位，上臂紧贴躯干，肘关节屈曲90°，前臂平行于地面","外旋：弹力带固定于健侧，患侧手握住弹力带，前臂向外旋转","内旋：弹力带固定于患侧，前臂向内旋转拉弹力带","动作终点保持2秒，缓慢控制回位","全程保持上臂紧贴躯干，仅前臂旋转运动"]},{"n":"弹力带肩胛骨前伸后缩训练","s":"每日2组","r":"15次/组","d":"强化前锯肌和菱形肌协调，改善肩胛骨动态稳定性，为颈肩复合体功能恢复打基础","st":["站立位，双手握弹力带两端，弹力带绕于背后肩胛骨高度","起始位：肩胛骨回缩，双手位于胸前","缓慢前推双手，同时肩胛骨向前伸展，感受前锯肌收缩","缓慢回收双手，同时肩胛骨向后回缩，感受菱形肌收缩","全程保持颈部中立，头不随肩前移"]},{"n":"YTWL肩胛稳定性训练","s":"每日2组","r":"每个字母8次","d":"俯卧位YTWL系列动作，全面激活上中下斜方肌及肩袖肌群，构建颈肩复合体动态稳定系统","st":["俯卧于治疗床或垫上，额部垫毛巾，双臂自然下垂","Y: 双臂前上举呈Y形，拇指朝上，肩胛骨后收，保持2秒","T: 双臂侧平举呈T形，拇指朝上，肩胛骨后收，保持2秒","W: 双臂屈肘外旋呈W形，肩胛骨后收下沉，保持2秒","L: 双臂屈肘90°外旋呈L形，肩胛骨后收，保持2秒"]}]},{"n":4,"t":"第16周以上（功能恢复期）","d":"伤后/术后16周及以上","g":"恢复全部日常生活和职业功能，建立终身的颈椎自我管理习惯，预防远期退变和再损伤，达到社会回归和运动回归目标","ex":[{"n":"颈椎动态神经肌肉控制训练","s":"每日1组","r":"每方向8-10次","d":"在不稳定平面或动态环境下进行颈椎控制训练，提升本体感觉和神经肌肉协调性","st":["站立于泡沫垫/BOSU球上，双足与肩同宽","保持颈部中立收下巴位，缓慢向各个方向转动头部","过程中保持躯干稳定，不因不平衡而出现代偿动作","进阶：闭眼状态下完成上述动作","每次转头后回到中立位再换方向，全程动作缓慢"]},{"n":"功能性负重训练（农夫行走）","s":"每日1组","r":"行走30米×3次","d":"双手持适当重量哑铃或壶铃行走，训练颈肩在功能性负荷下的稳定控制能力","st":["站立位，双手各持适当重量(从2-5kg起始)哑铃","收下巴、肩胛骨后收下沉、核心收紧","保持此姿势缓慢步行30米，步态自然","全程保持颈部和躯干稳定，不出现头部前探或耸肩","根据耐受程度逐步增加负重和距离"]},{"n":"颈椎自我松动训练（SNAGs）","s":"每日2组","r":"每方向6次","d":"使用毛巾辅助进行颈椎自我松动，改善残余关节活动度限制","st":["坐位，将毛巾置于颈后目标节段的上位棘突","双手向前上方牵拉毛巾，同时颈部主动向受限方向活动","在毛巾提供滑动辅助的同时完成主动活动","活动至无痛终点后保持3秒，缓慢回位","仅在有明确关节活动度限制且无神经症状时使用"]},{"n":"办公场景工效学训练","s":"每日多次","r":"每次保持30秒","d":"在模拟办公场景中进行间歇性姿势调整和微运动，培养正确的办公姿势习惯","st":["坐于办公椅，调整屏幕高度使视线水平略向下15°","每30分钟进行一次收下巴+肩胛回缩的姿势重置","保持正确坐姿30秒：耳-肩-髋在同一直线","交替进行颈部侧屈拉伸：左手扶右侧头部轻拉，保持15秒，换侧","离开座位步行1-2分钟后再回座"]},{"n":"全身协调性运动（游泳/快走）","s":"每周3-5次","r":"每次20-30分钟","d":"进行低冲击全身有氧运动，推荐仰泳和蛙泳（避免蝶泳和持续抬头泳姿），或快走，促进整体功能恢复","st":["热身5分钟：缓慢颈部各方向活动+上肢环绕","泳姿选择：仰泳（推荐）或蛙泳（保持头部与水面自然接触）","避免长时间持续仰头泳姿（自由泳单侧换气可接受）","运动中如出现颈部不适立即调整姿势或停止","运动后进行5分钟颈部放松拉伸"]}]}],"warnings":["骨折未获影像学愈合确认前，严禁擅自摘除颈托或进行颈椎主动活动，否则可能导致骨折移位、继发脊髓损伤","出现四肢麻木加重、肌力下降、大小便障碍等新发神经症状，需立即就诊排查脊髓受压或血肿形成","爆裂骨折伴椎管占位者需定期复查CT/MRI评估椎管形态，骨块后移可能引起迟发性脊髓压迫","长期颈托制动可能导致颞下颌关节紊乱和咀嚼肌萎缩，摘除颈托后需评估颞下颌关节功能","强直性脊柱炎合并颈椎骨折患者属于高危人群，即使低能量损伤也需全脊柱CT排查多节段损伤","颈椎骨折后吞咽功能可能因椎前血肿或水肿受影响，进食需注意呛咳风险，必要时行吞咽功能评估","恢复驾驶前必须确认颈部旋转活动度足够安全观察后方和侧方来车（通常需伤后3个月以上）","康复训练中出现颈痛加重、放射性疼痛或电击样感觉，应立即停止该动作并由康复医师重新评估"],"tips":["睡眠枕头高度以侧卧时头颈与脊柱保持直线为准（通常8-12cm），仰卧时枕高略低于侧卧，颈下可垫小圆枕维持生理前凸","颈托佩戴期间每日清洁颈部皮肤，检查有无压红或破损，可垫棉质衬垫增加舒适度","早期进食选择软食或半流质，避免需要用力咀嚼和大幅度张口食物，减少颈部肌肉代偿性紧张","使用手机和阅读时，将设备举至视线水平，避免长时间低头——低头30°时颈椎负荷约18kg，低头60°可达27kg","骨折愈合期（前3个月）禁烟，吸烟会显著抑制骨愈合和融合率，尼古丁导致血管收缩减少骨折端血供","可学习使用压力生物反馈仪(Stabilizer)进行颈深屈肌激活训练的生物反馈监测，起始目标压力值20-30mmHg","恢复运动前建议进行运动专项功能评估，接触性运动（橄榄球、搏击）和高风险运动（跳水、体操）需更长时间恢复"]},"atlantoaxialFx":{"name":"寰枢椎骨折","alias":"Atlantoaxial Fracture / Jefferson骨折 / Hangman骨折 / 齿状突骨折","dx":["明确头颈部外伤史（高处坠落头部着地、交通事故头颈部过伸伤、潜水意外等），伤后枕颈部剧痛、颈部僵硬、头颈活动严重受限，可伴枕大神经痛","张口位X线片是基础筛查：寰椎侧块相对于枢椎侧块向外移位总和≥6.9mm提示横韧带断裂(Jefferson骨折不稳定型)；齿状突骨折可见骨折线及移位","颈椎CT薄层扫描+三维重建是诊断金标准，可清晰显示：寰椎前后弓骨折(Jefferson骨折)、枢椎椎弓根骨折(Hangman骨折)、齿状突骨折类型(Anderson-D'Alonzo分型I/II/III型)","MRI可评估横韧带完整性、齿状突骨折端血供（II型骨折不愈合高危因素）、脊髓受压及信号改变、椎动脉走行异常","齿状突骨折Anderson-D'Alonzo分型：I型(齿突尖撕脱-稳定)、II型(基底部骨折-不愈合率高达30-60%)、III型(经枢椎体骨折-愈合率较高)；分型直接决定治疗方案","Hangman骨折Levine-Edwards分型：I型(无移位<3mm)、II型(成角>11°或移位>3mm)、IIA型(明显成角但无移位)、III型(伴C2-3关节突关节脱位)","必须排除椎动脉损伤(Blunt Cerebrovascular Injury)，尤其Hangman骨折和累及横突孔的骨折，CTA或MRA检查指征需放宽"],"sub":"寰枢椎骨折是上颈椎(C1-C2)的严重损伤，包括寰椎骨折(Jefferson骨折)、枢椎骨折(Hangman骨折、齿状突骨折)及其组合损伤。上颈椎解剖结构独特，承载颅颈交界的关键稳定功能，同时容纳延髓-颈髓交界和椎动脉。Jefferson骨折为寰椎前后弓断裂，横韧带完整性决定稳定性；Hangman骨折为枢椎双侧椎弓根骨折，多可保守治疗；齿状突骨折中II型因骨折端血供差而不愈合率高达30-60%，常需手术。神经损伤风险因椎管在C1-2水平相对宽大而低于下颈椎骨折，但一旦发生后果严重。康复以Halo架或颈胸支具严格制动为核心，配合神经功能监测和呼吸功能维护。","tags":[{"t":"上颈椎损伤","c":"danger"},{"t":"Halo架固定","c":"warn"},{"t":"神经高危","c":"danger"},{"t":"齿状突不愈合","c":"warn"},{"t":"呼吸监护","c":"accent"}],"phases":[{"n":1,"t":"第0-8周（严格制动期）","d":"伤后/术后0-8周","g":"确保上颈椎绝对稳定（Halo架/颈胸支具零位移），严密监测神经功能（尤其是呼吸功能），预防卧床并发症，为骨折愈合或融合提供最佳力学环境","ex":[{"n":"踝泵运动","s":"每1-2小时","r":"30次/组","d":"仰卧位主动踝关节屈伸运动，预防深静脉血栓形成","st":["仰卧，双腿伸直放松","缓慢用力做踝关节背屈（勾脚尖）至最大幅度，保持3秒","缓慢用力做踝关节跖屈（绷脚尖）至最大幅度，保持3秒","顺时针和逆时针各做10次踝关节环绕","双踝同时进行，每1-2小时完成一组30次"]},{"n":"腹式深呼吸训练","s":"每2小时","r":"10次/组","d":"腹式深呼吸维持肺功能和血氧，高位颈髓损伤患者尤其重要（C3-5支配膈神经）","st":["仰卧屈膝位，一手置于腹部","用鼻缓慢深吸气，感受腹部隆起而胸前不动","吸气至最大后屏气2-3秒","经口缩唇缓慢呼气，腹部下沉，呼气时间为吸气2倍","如出现呼吸困难或血氧下降，立即停止并通知医护"]},{"n":"有效咳嗽训练","s":"每日3组","r":"5次/组","d":"指导患者进行有效咳嗽和哈夫技术(Huff)，预防坠积性肺炎和肺不张","st":["坐位或半卧位，身体略前倾","深吸气后屏气2秒","用腹肌爆发力进行2-3次短促有力咳嗽","如咳嗽无力，可用哈夫技术：深吸气后快速用力呼气发出\"哈\"声","咳后休息30秒再进行下一次"]},{"n":"手部功能维持训练","s":"每日3组","r":"20次/组","d":"维持手内肌和前臂肌功能，预防失用性萎缩，为后期功能恢复保留基础","st":["仰卧或半卧位，双手置于体侧","缓慢用力做握拳动作，手指完全屈曲，保持3秒","缓慢伸展五指至完全张开，保持3秒","拇指依次触碰各指指尖做对指训练","使用软握力球或治疗泥进行抓握训练增加阻力"]},{"n":"下肢等长肌力训练","s":"每日3组","r":"每肌群10次","d":"仰卧位下进行股四头肌、臀大肌、腘绳肌等长收缩训练，维持下肢基础肌力","st":["股四头肌：仰卧膝下垫毛巾卷，大腿前方肌肉收紧保持5秒，放松5秒","臀大肌：双侧臀部肌肉同时夹紧，保持5秒，放松5秒","腘绳肌：膝后向下压床面，感受大腿后方肌肉收缩，保持5秒","每个肌群完成10次为一组","全程保持上半身不动，颈部不受力"]}]},{"n":2,"t":"第8-12周（过渡活动期）","d":"伤后/术后8-12周","g":"影像学确认骨折愈合进展后，在支具保护下逐步开始颈部静力性训练，激活颈深稳定肌群，改善头颈位置觉和本体感觉，逐步增加日常活动","ex":[{"n":"颈深屈肌低负荷激活训练","s":"每日3组","r":"10次/组","d":"仰卧位收下巴训练，以极低负荷(压力生物反馈仪20-22mmHg)激活颈深屈肌，避免浅层肌代偿","st":["仰卧，头下垫薄枕使头颈中立舒适位","将压力生物反馈仪(Stabilizer)置于颈后，充气至20mmHg基线","缓慢做点头收下巴动作(颅颈屈曲)，目标使压力表指针升至22mmHg并稳定","保持22mmHg稳定10秒，期间正常呼吸","如出现胸锁乳突肌过度用力或压力波动>2mmHg，回到20mmHg重新开始"]},{"n":"头颈位置觉再训练","s":"每日3组","r":"每方向5次","d":"在有视觉反馈（镜子）辅助下进行头部归位训练，重建颈部本体感觉和关节位置觉","st":["坐位，面对镜子，在镜面上标记一个十字参考线","缓慢向一侧转头约30°，保持5秒","闭眼状态下缓慢将头转回中立位","睁眼检查头部是否准确回归中立位，用镜子修正","重复各方向训练，逐渐增大活动范围至45°"]},{"n":"肩胛骨稳定性训练（无负重）","s":"每日3组","r":"10次/组","d":"无负重下进行肩胛骨后缩、前伸、上提、下降训练，改善颈肩复合体基础稳定","st":["坐位，双臂自然下垂，颈部中立收下巴位","肩胛骨后缩：双侧肩胛向脊柱中线靠拢，保持5秒","肩胛骨前伸：双侧肩胛向前外方伸展，保持5秒","肩胛骨上提后下降：耸肩保持3秒后用力沉肩保持3秒","全程颈部不动，仅肩胛骨运动"]},{"n":"颈椎等长抗阻训练（极低阻力）","s":"每日2组","r":"每方向3-5次","d":"用手掌提供极轻微阻力（小于最大力的20%）进行颈椎各方向等长收缩，仅在影像学确认骨折稳定后开始","st":["坐位，颈部中立位","前屈：手掌轻抵前额，颈部向前用力对抗，保持5秒（力度如按压眼睑）","后伸：手掌轻抵枕部，颈部向后对抗，保持5秒","侧屈：手掌轻抵颞部，颈部侧屈对抗，保持5秒","任何方向出现疼痛或不适立即停止"]},{"n":"上肢治疗性训练（弹力带低阻力）","s":"每日2组","r":"10次/组","d":"使用最低阻力弹力带进行肩关节各方向训练，维持上肢功能而不增加颈部负荷","st":["坐位，弹力带固定于适宜位置","肩前屈：手臂前举至90°，缓慢放下","肩外展：手臂侧举至90°，缓慢放下","肘屈伸：上臂贴紧躯干，肘关节屈伸","全程颈部中立位，躯干稳定不晃动"]}]},{"n":3,"t":"第12-16周（肌力重建期）","d":"伤后/术后12-16周","g":"系统重建颈部及上背部肌力，提升颈椎节段稳定性，改善颈椎动态控制能力，为脱支具后的日常生活功能恢复做全面准备","ex":[{"n":"弹力带颈部渐进抗阻训练","s":"每日2组","r":"每方向8-10次","d":"使用弹力带进行颈部全方向动态抗阻训练，强度从最低开始逐周增加","st":["坐位，弹力带固定于适当高度","前屈：弹力带经前额，低头对抗阻力(2秒向心/4秒离心)","后伸：弹力带经枕部，仰头对抗阻力","侧屈：弹力带经颞部，侧屈对抗阻力，左右分别训练","旋转：弹力带经颞部前方，转头对抗阻力，左右分别训练"]},{"n":"仰卧位颈深屈肌进阶训练","s":"每日2组","r":"10次/组","d":"在压力生物反馈仪监测下进阶颈深屈肌训练，逐步提升目标压力至24-30mmHg","st":["仰卧，压力生物反馈仪置于颈后，充气至20mmHg","分5级进阶：目标压力22→24→26→28→30mmHg","每级能稳定保持10秒且无浅层肌代偿方可进至下一级","全程胸锁乳突肌应无明显收缩","无法稳定维持某级压力时退回前一级巩固"]},{"n":"四点跪位颈部动态稳定训练","s":"每日2组","r":"保持30秒×5次","d":"四点跪位下进行颈部抗重力稳定训练，整合核心与颈椎控制","st":["四点跪位，手肩同宽，膝髋同宽","收腹收下巴使头颈与躯干直线","保持此姿势30秒","进阶1：交替抬上肢前伸保持10秒","进阶2：交替抬下肢后伸保持10秒（Bird-Dog）"]},{"n":"俯卧位颈后伸训练","s":"每日2组","r":"8次/组","d":"俯卧位下进行颈部后伸抗重力训练，针对性强化颈后伸肌群","st":["俯卧于治疗床，头部伸出床沿，额部下方可垫毛巾","收下巴后缓慢抬头至颈部中立位（不超伸），保持5秒","缓慢控制头部下降回位","全程避免颈部过度后伸，目标为达到中立位而非最大后伸","如出现头晕或疼痛立即停止"]},{"n":"TheraBand上肢全面抗阻训练","s":"每日2组","r":"12次/组","d":"使用不同阻力级别TheraBand进行上肢全面抗阻训练，重建上肢功能性肌力","st":["肩前屈/外展抗阻训练，每组12次","肘屈伸抗阻训练，上臂贴紧躯干","肩内外旋训练（肩袖肌群强化）","划船训练强化上背部肌群","全程颈部中立位，呼吸配合动作节律"]}]},{"n":4,"t":"第16周以上（功能回归期）","d":"伤后/术后16周及以上","g":"全面恢复日常生活、职业和运动功能，建立上颈椎终身保护意识，预防远期并发症和退行性改变","ex":[{"n":"不稳定平面颈部动态控制训练","s":"每日1组","r":"每方向8次","d":"在泡沫垫或BOSU球上进行颈部多方向运动，高级神经肌肉控制和本体感觉训练","st":["站立于泡沫垫上，双足与肩同宽","保持颈部中立收下巴位","缓慢向各方向转头和侧屈","进阶：闭眼完成上述动作","全程核心收紧，身体不出现大幅晃动"]},{"n":"颈椎关节松动自我训练","s":"每日1组","r":"每方向6次","d":"使用毛巾进行SNAGs自我松动，改善残余关节活动度限制","st":["坐位，毛巾置于受限节段上位椎体棘突","双手向前上牵拉毛巾提供滑动辅助","同时主动向受限方向活动颈部","至无痛终点保持3秒后回位","仅在无神经症状且有明确关节限制时使用"]},{"n":"功能性颈肩复合训练","s":"每日1组","r":"10次/组","d":"模拟日常功能性动作进行颈肩复合训练，如推、拉、举、搬运等动作模式","st":["过头推举训练（轻重量，1-3kg起始）","地面至桌面高度搬运物品训练","坐姿转体取物训练（躯干旋转+头颈稳定）","推门/拉门动作模式训练","每动作完成10次，全程颈部中立"]},{"n":"有氧耐力训练","s":"每周3-5次","r":"每次20-30分钟","d":"进行中低强度有氧运动，如快走、固定自行车、椭圆机，提高全身耐力和心肺功能","st":["热身5分钟：缓慢颈部和四肢关节活动","选择适合的有氧方式（避免跑步机等可能摔倒的设备）","维持心率在最大心率的60-70%（中等强度）","运动中保持颈部中立位，每5分钟检查一次姿势","整理运动5分钟：全身拉伸放松"]},{"n":"驾驶功能恢复训练","s":"每周2-3次","r":"每次15分钟","d":"分阶段恢复驾驶所需颈部功能：转头观察后方、侧方来车，快速扫视后视镜","st":["第一阶段：静态坐姿下练习快速左右转头（无痛范围）","第二阶段：坐姿下配合躯干旋转转头（模拟倒车）","第三阶段：在静止车辆内练习各方向观察","第四阶段：在安全封闭场地内短距离驾驶","正式上路前必须经康复医师评估颈部活动度满足安全驾驶要求"]}]}],"warnings":["齿状突II型骨折不愈合率高达30-60%，需定期CT随访至骨折完全愈合（通常需6-12个月），如出现骨折端吸收或硬化需考虑手术","Halo架固定期间每日检查钉道，如出现钉道红肿、渗液、松动或颅内感染征象（头痛、发热、意识改变）需紧急处理","上颈椎损伤累及C1-3水平可影响膈神经(C3-5)，出现呼吸困难、血氧下降需紧急评估呼吸功能，必要时行肺功能测试","椎动脉损伤是上颈椎骨折的潜在致命并发症，出现眩晕、复视、构音障碍、共济失调等后循环缺血症状应立即行CTA检查","寰枢椎旋转半脱位(Atlantoaxial Rotatory Subluxation)可表现为斜颈(Torticollis)畸形，需与肌性斜颈鉴别，CT旋转位扫描可确诊","枕颈部疼痛持续不缓解或加重需排查枕颈不稳、假关节形成或迟发性脊髓病","Hangman骨折II型和IIA型过伸牵引可能导致C2-3椎间盘损伤加重和不稳定，复位操作需在影像监视下谨慎进行","恢复运动前需经专科评估，接触性运动和高风险运动（跳水、体操、搏击、橄榄球）通常建议伤后至少6个月且影像学完全愈合"],"tips":["Halo架固定期间洗头可用干洗帽或他人协助侧卧洗头，避免水流进入钉道；钉道周围可用棉签蘸生理盐水轻柔清洁","睡眠时使用Halo架配套的专用枕或自制支撑垫，确保头部与躯干在同一平面，避免悬空或扭转","上颈椎损伤康复期间避免任何可能引起头颈部突然晃动的活动，如大笑、剧烈咳嗽时用手扶稳头部","齿状突骨折患者应保证充足的钙(1000-1200mg/日)和维生素D(800-2000IU/日)摄入，促进骨愈合","Halo架拆除后枕颈部皮肤可能出现压痕和感觉异常，可用温热毛巾轻柔热敷促进循环恢复，通常2-4周自行缓解","可学习使用颈深屈肌训练专用设备如压力生物反馈仪(Stabilizer)在家中进行客观化训练监测","寰枢椎骨折愈合后仍建议避免长时间低头工作，每小时起身做收下巴+肩胛回缩的姿势重置训练"]}},"surgery":{"acdf":{"name":"颈椎前路椎间盘切除融合术","alias":"ACDF / Anterior Cervical Discectomy and Fusion / 颈椎前路减压融合术","dx":["颈椎间盘突出症（中央型/旁中央型）经规范保守治疗≥6-12周无效，伴有明确的神经根或脊髓受压症状","颈椎MRI示椎间盘突出/脱出，压迫硬膜囊或神经根，伴脊髓信号改变（T2WI高信号提示脊髓水肿/软化）","神经根型颈椎病：根性疼痛、感觉异常和/或肌力下降，与受压神经根支配区域一致，Spurling试验阳性","脊髓型颈椎病：上肢精细动作障碍（扣扣子、用筷子困难）、下肢步态异常（宽基步态、痉挛步态）、Hoffmann征/Rossolimo征阳性、Babinski征阳性","颈椎动力位X线示病变节段无明显不稳（椎体滑移<3mm、角度变化<11°），单纯椎间盘突出适合ACDF","颈椎CT示椎间盘突出伴或不伴后缘骨赘形成，需明确突出物有无钙化（钙化型突出可能增加前路切除难度）","排除后纵韧带骨化(OPLL)为主的病变（OPLL以前路切除风险高，需考虑后路或前后路联合）"],"sub":"颈椎前路椎间盘切除融合术(ACDF)是治疗颈椎间盘突出症、脊髓型颈椎病和神经根型颈椎病的经典前路术式。手术经颈前入路切除病变椎间盘并植入椎间融合器(cage)或自体/异体骨实现椎间融合。ACDF的优势在于可直接解除来自前方的脊髓/神经根压迫，恢复椎间高度和生理前凸，创伤相对较小。术后特有并发症包括吞咽困难（食管牵拉）、声音嘶哑（喉返神经牵拉）、植骨不融合/假关节形成以及邻椎病(ASD)。康复核心为术后颈托保护4-6周、早期吞咽功能管理、融合节段保护，随后渐进恢复颈部功能。融合率约90-95%，但邻椎病10年发生率约25%。","tags":[{"t":"颈椎前路手术","c":"accent"},{"t":"椎间盘突出","c":"purple"},{"t":"融合术后康复","c":"success"},{"t":"吞咽管理","c":"warn"},{"t":"邻椎病预防","c":"danger"}],"phases":[{"n":1,"t":"第0-4周（术后保护期）","d":"术后0-4周","g":"保护融合节段稳定性，管理术后吞咽困难和声音嘶哑，控制颈痛和上肢残留症状，预防并发症（血肿、食管损伤、植入物移位），开始安全的早期活动","ex":[{"n":"吞咽功能训练（Mendelsohn手法）","s":"每日3组","r":"10次/组","d":"针对ACDF术后吞咽困难的核心康复训练，通过喉部上抬维持动作改善吞咽协调性","st":["坐位，身体前倾15°，颈部中立位（佩戴颈托）","做吞咽动作，在喉结上抬至最高点时","主动用力保持喉部上抬位置2-3秒（用手指轻触喉结辅助感知）","然后放松喉部完成吞咽","每次训练后饮一小口温水(约5ml)练习实际吞咽"]},{"n":"声带放松训练","s":"每日3组","r":"10次/组","d":"针对喉返神经牵拉导致的声音嘶哑，进行声带放松和呼吸协调训练","st":["坐位，颈部放松（佩戴颈托），双肩下沉","用腹式呼吸深吸气","呼气时发\"嘶——\"音（清辅音，不振动声带），持续10-15秒","进阶：呼气时发\"z——\"音（浊辅音，轻微振动声带），持续10-15秒","再进阶：用正常音量从1数到10，注意音量和音质"]},{"n":"踝泵运动","s":"每1-2小时","r":"30次/组","d":"预防术后卧床期间深静脉血栓形成","st":["仰卧或半卧位，双腿自然伸直","缓慢用力勾脚尖至最大幅度，保持3秒","缓慢用力绷脚尖至最大幅度，保持3秒","以踝关节为轴做环绕运动，顺时针逆时针各10次","双踝同时进行，每1-2小时完成一组"]},{"n":"上肢神经滑动训练（正中神经/尺神经/桡神经）","s":"每日2组","r":"每条神经5次","d":"在无痛范围内进行上肢外周神经滑动，预防术后神经根粘连和上肢残留症状加重","st":["正中神经滑动：肩外展45°外旋，伸腕伸指，头向对侧侧屈；然后屈腕屈指，头回中立位","尺神经滑动：肩外展90°外旋，屈肘，手掌靠近同侧耳朵，然后伸肘，手指指向后方","桡神经滑动：肩内收内旋，屈腕屈指，头向同侧侧屈；然后伸腕伸指，头向对侧侧屈","每条神经滑动5次为一组，动作缓慢流畅","出现上肢放射性痛或麻木加重立即停止"]},{"n":"胸廓出口放松训练","s":"每日3组","r":"保持30秒×3次","d":"放松斜角肌和胸小肌，扩大胸廓出口空间，缓解术后上肢残留症状","st":["坐位，颈部中立（佩戴颈托），双肩放松","做腹式深呼吸，吸气时感受胸廓侧方和后方的扩张","呼气时主动放松双肩下沉，感受颈部两侧斜角肌区域的松弛","保持放松姿势30秒，正常呼吸","可配合将一侧手臂置于同侧大腿上做被动肩下沉"]}]},{"n":2,"t":"第4-8周（早期活动期）","d":"术后4-8周","g":"影像学确认融合进展后逐步摘除颈托，开始颈部主动活动度恢复训练，激活颈深屈肌，建立颈椎节段性控制，开始肩胛带基础训练","ex":[{"n":"颈深屈肌激活训练（压力生物反馈仪）","s":"每日3组","r":"10次/组","d":"使用压力生物反馈仪进行颈深屈肌分级激活训练，目标压力从20→22→24→26→28→30mmHg逐级进阶","st":["仰卧，膝下垫枕，压力生物反馈仪置于颈后，充气至20mmHg","缓慢做点头收下巴动作(颅颈屈曲)，使压力上升至22mmHg","稳定保持22mmHg 10秒，期间正常呼吸不憋气","能稳定完成10次后，进阶至下一目标压力","全程胸锁乳突肌和前斜角肌不应明显收缩（浅层肌代偿即退回前一级）"]},{"n":"颈椎主动活动度训练（无痛范围）","s":"每日2组","r":"每方向5次","d":"在无痛范围内缓慢进行颈椎各方向主动活动，恢复颈椎关节活动度","st":["坐位，颈椎中立位，动作缓慢(5秒完成一个方向)","前屈(低头)：缓慢将下巴靠近胸骨，至无痛终点保持3秒","后伸(仰头)：缓慢仰头视天花板，至无痛终点保持3秒","侧屈：缓慢将耳朵靠近同侧肩膀，至无痛终点保持3秒，左右交替","旋转：缓慢转头看向同侧肩膀方向，至无痛终点保持3秒，左右交替"]},{"n":"肩胛骨稳定性训练（弹力带低阻力）","s":"每日2组","r":"12次/组","d":"使用低阻力弹力带进行肩胛骨后缩、前伸训练，改善颈肩复合体功能","st":["坐位，双手握弹力带两端，弹力带绕过背后","肩胛骨后缩(划船)：屈肘后拉弹力带，肩胛骨向中线靠拢，保持2秒","肩胛骨前伸：双臂前推，肩胛骨向前外方伸展，保持2秒","动作缓慢可控，躯干保持稳定","全程颈部中立收下巴位，不随动作出现头前伸"]},{"n":"颈椎等长抗阻训练","s":"每日2组","r":"每方向5次","d":"用手掌提供轻度阻力进行颈椎各方向等长收缩，促进颈部肌群激活而不产生关节活动","st":["坐位，颈部中立位","前屈抗阻：手掌抵前额，颈部前屈发力对抗，保持5秒","后伸抗阻：双手交叉置枕后，颈部后伸发力对抗，保持5秒","侧屈抗阻：手掌抵同侧颞部，颈部侧屈对抗，保持5秒，左右交替","旋转抗阻：手掌抵同侧颞部前方，颈部旋转对抗，保持5秒，左右交替"]},{"n":"姿势再教育训练","s":"每日多次","r":"每次保持30秒","d":"纠正头前伸和圆肩姿势，建立正确的颈肩静态排列","st":["背靠墙面站立，足跟距墙约10cm","使臀部、胸椎、枕部三点接触墙面","收下巴使枕部轻触墙面，同时肩胛骨后收使双肩接触墙面","保持此姿势30秒，正常呼吸","每日多次练习，逐渐将正确姿势泛化至日常坐姿和站姿"]}]},{"n":3,"t":"第8-12周（肌力恢复期）","d":"术后8-12周","g":"系统强化颈部及肩带上肢肌力，提升融合节段相邻节段的动态保护能力，改善颈椎整体耐力和功能性活动能力，为重返工作岗位做准备","ex":[{"n":"弹力带颈部多方向抗阻训练","s":"每日2组","r":"每方向10次","d":"使用弹力带进行颈部全方向动态抗阻训练，强化颈部肌群力量和耐力","st":["坐位，弹力带固定于适当高度和位置","前屈抗阻：弹力带经前额，低头对抗阻力，2秒向心/4秒离心","后伸抗阻：弹力带经枕部，仰头对抗阻力","侧屈抗阻：弹力带经颞部，侧屈对抗阻力","旋转抗阻：弹力带经颞部前方，转头对抗阻力"]},{"n":"俯卧位颈后伸肌群强化训练","s":"每日2组","r":"10次/组","d":"俯卧位下进行颈部后伸抗重力训练，针对性强化颈半棘肌和多裂肌等后伸肌群","st":["俯卧于治疗床，头部伸出床沿，额下垫毛巾","收下巴，缓慢抬头至颈部中立位（不超过中立位），保持5秒","缓慢控制头部下降回起始位","进阶1：增加保持时间至10秒","进阶2：抬头同时做极小范围(5°)的左右旋转"]},{"n":"YTWL肩胛稳定系列训练","s":"每日2组","r":"每个字母8次","d":"俯卧位YTWL系列全面激活斜方肌上中下束、菱形肌和肩袖肌群","st":["俯卧于垫上，额下垫毛巾，双臂自然下垂","Y：双臂前上举呈Y形，拇指朝上，肩胛后收，保持2秒","T：双臂侧平举呈T形，拇指朝上，肩胛后收，保持2秒","W：屈肘外旋呈W形，肩胛后收下沉，保持2秒","L：屈肘90°外旋呈L形，肩胛后收，保持2秒"]},{"n":"上肢渐进性抗阻训练","s":"每日2组","r":"12次/组","d":"使用弹力带或轻量哑铃进行上肢全面抗阻训练，重建上肢功能性力量","st":["肩前屈抗阻：弹力带固定于脚下，手臂前举","肩外展抗阻：弹力带固定于脚下，手臂侧举","肘屈伸抗阻：弹力带固定于脚下，肘关节屈伸","划船训练：弹力带固定于前方，双臂后拉","全程颈部中立位，使用适当阻力(能完成12次不代偿)"]},{"n":"颈椎深屈肌耐力训练","s":"每日2组","r":"保持30秒×5次","d":"延长颈深屈肌持续收缩时间，建立耐力基础，保护融合相邻节段","st":["仰卧，压力生物反馈仪置于颈后，充气至20mmHg","收下巴使压力上升至目标值(24-28mmHg)","保持该压力稳定30秒，正常呼吸","放松30秒后进行下一次","压力波动超过2mmHg视为失败，退回低目标值巩固"]}]},{"n":4,"t":"第12周以上（功能强化期）","d":"术后12周及以上","g":"全面恢复日常生活和职业功能，建立邻椎病预防策略和终身的颈椎自我管理体系，回归运动和休闲活动","ex":[{"n":"不稳定平面颈部动态控制训练","s":"每日1组","r":"每方向8-10次","d":"在泡沫垫/BOSU球上进行颈部多方向运动，高级本体感觉和神经肌肉控制训练","st":["站立于泡沫垫上，双足与肩同宽","收下巴、核心收紧、肩胛后收","缓慢向各方向转头和侧屈","进阶：闭眼完成上述动作","再进阶：单腿站立下完成颈部运动"]},{"n":"颈部动态抗阻+躯干运动整合训练","s":"每日1组","r":"每方向10次","d":"在躯干运动的同时进行颈部抗阻训练，训练颈-躯干运动分离控制能力","st":["坐于瑞士球上，双脚踩地","在维持瑞士球小幅弹动的同时进行颈部等长抗阻训练","在躯干向一侧旋转的同时颈部向另一侧旋转（运动分离）","在躯干侧屈的同时保持颈部中立位（选择性稳定）","所有动作缓慢控制，呼吸配合"]},{"n":"功能性负重训练","s":"每日1组","r":"30米×3次","d":"双手持轻量哑铃行走（农夫行走），在功能性负荷下训练颈肩稳定控制","st":["站立位，双手各持2-5kg哑铃","收下巴、肩胛后收下沉、核心收紧","保持此姿势步行30米","全程头颈中立，不耸肩不探颈","根据耐受逐步增加负重至8-10kg"]},{"n":"邻椎保护专项训练","s":"每日2组","r":"每节段10次","d":"针对融合相邻节段进行保护性训练，包括节段性颈椎屈伸控制和局部稳定训练","st":["坐位，手指置于融合相邻节段的后方棘突旁","做小幅度(10-15°)的颅颈屈曲，感受上位颈椎的活动","保持下位颈椎稳定，仅在上位节段产生活动","同样方式训练上下节段的分离控制","训练中如出现融合节段区域疼痛立即停止"]},{"n":"有氧运动和休闲活动回归","s":"每周3-5次","r":"每次20-40分钟","d":"逐步回归中低强度有氧运动和休闲体育活动，建立终身的运动习惯","st":["推荐运动：快走、椭圆机、固定自行车、游泳(仰泳优先)","运动前充分热身5-10分钟","运动强度控制在自感劳累评分(RPE)11-13(轻松-稍累)","避免高风险运动：搏击类、跳水、高冲击有氧、大重量举重","运动中出现颈痛或上肢症状立即停止"]}]}],"warnings":["术后吞咽困难是最常见并发症(发生率20-70%)，多数2-4周缓解；若持续超过6周或进行性加重，需行食管镜/喉镜检查排除食管穿孔或血肿","声音嘶哑通常为喉返神经牵拉伤所致，多在数周至3个月内自行恢复；若超过3个月未恢复需耳鼻喉科评估声带功能","术后24-48小时内严密观察颈部有无肿胀和呼吸困难，颈前血肿压迫气管是ACDF最危险的早期并发症，需紧急处理","融合器下沉/移位可导致椎间高度丢失和神经根孔狭窄，术后3、6、12个月需定期X线复查融合器位置和融合状态","邻椎病(ASD)是ACDF远期主要并发症，10年发生率约25%，表现为融合相邻节段退变加速，需终身颈椎保健","术后上肢症状（疼痛、麻木、无力）如无改善或反而加重，需MRI复查排除减压不彻底、血肿压迫或神经根牵拉损伤","植骨不融合/假关节形成表现为术后6个月以上持续颈痛，动力位X线示融合节段活动度>2°或棘突间距离变化>2mm","术后颈部禁止做过度后伸动作（如仰头洗发），会增加融合相邻节段的应力负荷，加速邻椎退变"],"tips":["术后2周内建议进食温凉软食或半流质（粥、蒸蛋、果泥、酸奶），避免烫食（温度过高刺激食管吻合口）和硬质食物","吞咽训练时可对着镜子观察喉结上抬幅度，或用手轻触喉结感知上抬动作是否充分","术后睡眠采用仰卧或侧卧，枕头高度以维持颈部中立位为准；侧卧时枕头填满耳到肩的距离，避免颈部侧屈","可学习使用压力生物反馈仪(Stabilizer)在家中进行颈深屈肌训练的客观监测，每周记录目标压力值变化","避免长时间低头使用手机或平板——这是邻椎病最重要的可改变危险因素，建议使用支架将设备举至视线水平","恢复驾驶的时机：通常术后4-6周，但需满足颈部旋转≥60°（安全观察后方来车）且无上肢麻木影响操控能力","术后6个月复查时建议行颈椎动力位X线评估融合状态，此后每年复查一次侧位X线监测邻椎退变"]},"posteriorLaminoplasty":{"name":"颈椎后路椎管扩大成形术","alias":"Posterior Cervical Laminoplasty / 颈椎后路椎板成形术 / 椎管扩大成形术（单开门/双开门）","dx":["多节段(≥3节段)脊髓型颈椎病，MRI示多节段椎管狭窄伴脊髓受压和/或脊髓内T2WI高信号改变","后纵韧带骨化(OPLL)导致椎管侵占率≥50%，尤其适用于连续型或混合型OPLL","发育性颈椎管狭窄（椎管矢状径<12mm或Pavlov比值<0.75），合并脊髓压迫症状","黄韧带肥厚/骨化导致的后方脊髓压迫，脊髓前方无明显压迫或前方压迫为次要因素","体格检查：Hoffmann征阳性、动态Hoffmann征阳性、下肢腱反射亢进、Babinski征阳性、步态异常（宽基步态、Romberg征阳性）","颈椎CT示椎管矢状径减小、椎板增厚、OPLL范围及厚度，三维重建评估椎板开门角度和骨槽位置","排除颈椎后凸畸形（后凸>13°为椎板成形术相对禁忌证，后凸>30°为绝对禁忌证），术前需测量C2-7 Cobb角"],"sub":"颈椎后路椎管扩大成形术（椎板成形术/Laminoplasty）是治疗多节段脊髓型颈椎病、后纵韧带骨化(OPLL)和发育性椎管狭窄的经典后路术式。手术将一侧椎板切开（开门侧）另一侧做骨槽（铰链侧），将椎板向后掀起扩大椎管容积，使脊髓向后漂移避开前方压迫。术式保留了颈椎活动度（与椎板切除融合术不同），但需剥离双侧椎旁肌，术后轴性颈痛和C5神经根麻痹为特有并发症。康复核心为颈托保护4-6周、颈椎后伸肌群保护（后路剥离椎旁肌需时间修复）、轴性颈痛管理和渐进功能恢复。开门角度维持和铰链侧骨愈合是影响远期疗效的关键。","tags":[{"t":"颈椎后路手术","c":"accent"},{"t":"多节段狭窄","c":"purple"},{"t":"OPLL","c":"danger"},{"t":"轴性颈痛管理","c":"warn"},{"t":"C5麻痹预防","c":"danger"}],"phases":[{"n":1,"t":"第0-4周（术后保护期）","d":"术后0-4周","g":"保护后路切口和铰链侧骨愈合，管理术后轴性颈痛和切口疼痛，严密监测C5神经根麻痹征象，预防椎旁肌粘连和瘢痕形成，开始安全的早期活动","ex":[{"n":"术后体位管理和翻身训练","s":"每2小时","r":"每次翻身练习","d":"学习在佩戴颈托的情况下安全地轴向翻身，避免颈部旋转和侧屈","st":["仰卧，颈托佩戴良好，膝下垫枕","翻身前先将头部微收下巴，保持颈部中立","采用\"滚木式\"翻身：肩-髋-膝同步转动，头颈与躯干保持为一个整体","侧卧后在上方腿和手臂下垫枕支撑","每2小时变换体位一次，交替仰卧和左右侧卧"]},{"n":"踝泵运动","s":"每1-2小时","r":"30次/组","d":"术后卧床期间预防深静脉血栓形成","st":["仰卧或半卧位，双腿自然伸直","缓慢用力勾脚尖至最大幅度，保持3秒","缓慢用力绷脚尖至最大幅度，保持3秒","踝关节顺时针和逆时针环绕各10次","双踝同时进行，每1-2小时完成一组"]},{"n":"上肢C5-C8肌力自我监测训练","s":"每日2组","r":"每动作10次","d":"通过特定动作自我监测C5神经根麻痹（三角肌/肱二头肌无力）和C6-8功能状态","st":["C5监测：仰卧，尝试手臂前屈(肩前屈)至45°，观察能否完成","C5监测：坐位，尝试屈肘至90°对抗轻微重力","C6监测：尝试伸腕动作（手掌向上推）","C7监测：尝试伸肘动作","C8/T1监测：尝试手指外展并拢（夹纸试验），记录每日变化"]},{"n":"腹式深呼吸训练","s":"每2小时","r":"10次/组","d":"维持肺功能和血氧，预防术后肺不张和坠积性肺炎","st":["仰卧屈膝位，一手置于腹部","用鼻缓慢深吸气，腹部隆起，胸前不动","吸气至最大后屏气2-3秒","经口缩唇缓慢呼气，腹部下沉","呼气时间为吸气时间的2倍"]},{"n":"肩胛骨被动/主动辅助活动","s":"每日2组","r":"10次/组","d":"在无痛范围内进行肩胛骨轻柔活动，预防椎旁肌剥离区域的瘢痕粘连和肩胛胸廓关节僵硬","st":["仰卧位，他人或健侧手辅助患侧手臂","轻柔地将肩胛骨向脊柱中线方向做内收运动","轻柔地将肩胛骨向前外方做前伸运动","动作幅度以不牵拉后路切口为限","全程缓慢，每动作保持3-5秒"]}]},{"n":2,"t":"第4-8周（早期活动期）","d":"术后4-8周","g":"逐步摘除颈托，开始颈部主动活动度恢复，重点保护颈椎后伸肌群（剥离的椎旁肌），管理轴性颈痛，激活颈深稳定肌群","ex":[{"n":"颈椎无痛主动活动度训练","s":"每日2组","r":"每方向5次","d":"在无痛范围内缓慢进行颈椎各方向主动活动，特别注意后伸动作需极度缓慢且不超越无痛范围","st":["坐位，颈部中立位，所有动作5秒完成一个方向","前屈：缓慢低头，下巴靠近胸骨，无痛终点保持3秒","后伸：极度缓慢仰头（速度是其他方向的1/2），无痛终点保持3秒","侧屈：缓慢耳朵靠近同侧肩膀，无痛终点保持3秒","旋转：缓慢转头看向同侧肩膀方向，无痛终点保持3秒"]},{"n":"颈深屈肌激活训练","s":"每日3组","r":"10次/组","d":"仰卧位收下巴训练激活颈深屈肌，建立颈椎前方稳定机制，减轻后方结构的力学负荷","st":["仰卧，膝下垫枕，颈后置压力生物反馈仪充气至20mmHg","缓慢点头收下巴，压力上升至22mmHg","稳定保持22mmHg 10秒，正常呼吸","胸锁乳突肌和前斜角肌不应明显收缩","逐级进阶至24→26→28→30mmHg"]},{"n":"肩胛骨稳定性训练（无负重）","s":"每日3组","r":"12次/组","d":"无负重下进行肩胛骨各方向活动，改善椎旁肌剥离区域的肌肉再激活和肩胛控制","st":["坐位，双臂自然下垂，颈部中立收下巴位","后缩：肩胛骨向脊柱中线靠拢，保持5秒","前伸：肩胛骨向前外方伸展，保持5秒","上提后下降：耸肩保持3秒后用力沉肩保持3秒","肩胛骨环绕：缓慢做肩胛骨顺时针和逆时针环绕各5次"]},{"n":"颈椎后伸肌群轻柔激活训练","s":"每日2组","r":"保持5秒×5次","d":"俯卧位下进行极低负荷的颈后伸肌群等长激活，动作幅度极小，重在神经肌肉再连接","st":["俯卧，额下垫毛巾，头颈中立位","意念集中于颈后部剥离的椎旁肌区域","做极小幅度(仅1-2cm)的头部抬离毛巾动作","保持该轻微收缩5秒，然后完全放松","如诱发颈后疼痛或牵拉感，减少幅度或暂停"]},{"n":"姿势再教育（靠墙站立）","s":"每日多次","r":"每次保持30-60秒","d":"重建正确的头颈肩排列，纠正头前伸和圆肩姿势","st":["背靠墙站立，足跟距墙约10cm","臀、胸椎、枕部三点接触墙面","收下巴使枕部轻触墙面","肩胛后收使双肩靠近墙面","保持30-60秒，正常呼吸，感受颈后肌群轻微牵拉"]}]},{"n":3,"t":"第8-12周（肌力恢复期）","d":"术后8-12周","g":"系统重建颈后伸肌群力量和耐力（后路手术的核心康复目标），强化肩胛带肌群，改善颈椎动态稳定性，管理残余轴性颈痛","ex":[{"n":"俯卧位颈后伸肌群渐进抗阻训练","s":"每日2组","r":"10次/组","d":"俯卧位下进行颈部后伸抗重力训练，从无负重到逐步增加阻力，重建剥离椎旁肌的肌力","st":["俯卧于治疗床，头部伸出床沿，额下垫毛巾","收下巴，缓慢抬头至颈部中立位(不过伸)，保持5秒","缓慢控制下降回位(4秒)","进阶1：双手置于腰部增加躯干稳定性","进阶2：在头部佩戴轻量(0.5-1kg)沙袋增加阻力"]},{"n":"弹力带颈后伸专项训练","s":"每日2组","r":"10次/组","d":"使用弹力带进行颈后伸方向的专项抗阻训练，目标性强化剥离的椎旁肌","st":["坐位，弹力带经枕后固定于前方高处","收下巴起始位","缓慢仰头对抗弹力带阻力(2秒向心)","缓慢低头离心回位(4秒离心)","动作幅度从小(15°)逐渐增大至无痛范围(30-45°)"]},{"n":"YTWL肩胛稳定系列训练","s":"每日2组","r":"每个字母8次","d":"俯卧位YTWL全面激活斜方肌和肩袖肌群，改善椎旁肌与肩带肌的协同功能","st":["俯卧于垫上，额下垫毛巾","Y：双臂前上举呈Y形，拇指朝上，肩胛后收，保持2秒","T：双臂侧平举呈T形，拇指朝上，肩胛后收，保持2秒","W：屈肘外旋呈W形，肩胛后收下沉，保持2秒","L：屈肘90°外旋呈L形，肩胛后收，保持2秒"]},{"n":"弹力带划船训练（中高阻力）","s":"每日2组","r":"12次/组","d":"使用中阻力弹力带进行划船训练，强化菱形肌和中下斜方肌，改善颈后肌群的协同收缩","st":["坐位，弹力带固定于前方约胸高","双手握弹力带，起始位肩胛前伸","屈肘后拉，肩胛骨充分回缩，保持2秒","缓慢控制前伸回位(4秒)","全程颈部中立位，不出现头前伸代偿"]},{"n":"四点跪位颈部-核心整合训练","s":"每日2组","r":"保持30秒×5次","d":"四点跪位下整合颈后肌群与核心肌群的协同稳定功能","st":["四点跪位，手肩同宽，膝髋同宽","收腹收下巴使头颈与躯干直线","保持此姿势30秒，颈后肌群轻等长收缩","进阶1：交替抬上肢前伸(Bird-Dog)","进阶2：交替抬对侧上下肢"]}]},{"n":4,"t":"第12周以上（功能强化期）","d":"术后12周及以上","g":"全面恢复日常生活和职业功能，建立颈后伸肌群终身体护策略，预防铰链侧骨不愈合和再关门，回归运动和休闲活动","ex":[{"n":"不稳定平面颈部动态控制训练","s":"每日1组","r":"每方向10次","d":"在泡沫垫或BOSU球上进行颈部多方向运动和颈后伸肌群动态控制训练","st":["站立于泡沫垫上，双足与肩同宽","收下巴、核心收紧","缓慢向各方向转头和侧屈","进阶1：闭眼完成上述动作","进阶2：单腿站立完成颈部运动"]},{"n":"颈后伸肌群耐力训练","s":"每日1组","r":"保持60秒×5次","d":"延长颈后伸肌群持续收缩时间，建立耐力基础，预防轴性颈痛复发","st":["俯卧位，头部伸出床沿，额下垫毛巾","收下巴抬头至中立位","保持此姿势60秒（或至疲劳但无痛）","如能轻松完成，在头部佩戴0.5-1kg沙袋","训练后如出现颈后酸胀属正常，尖锐疼痛需减少强度"]},{"n":"功能性负重训练（农夫行走）","s":"每日1组","r":"30米×3次","d":"双手持轻量哑铃行走，在功能性负荷下训练颈后伸肌群和肩带稳定控制","st":["站立位，双手各持2-5kg哑铃","收下巴、肩胛后收下沉、核心收紧","保持姿势步行30米","全程颈部中立，不耸肩不探颈","逐步增加负重至耐受范围"]},{"n":"颈部抗旋转核心整合训练","s":"每日1组","r":"每侧10次","d":"使用弹力带进行抗旋转训练，整合颈后肌群与躯干旋转稳定功能","st":["站立位，弹力带固定于体侧","双手握弹力带于胸前，保持颈部中立","对抗弹力带拉力，维持躯干和颈部不旋转","保持30秒后换另一侧","进阶：在维持抗旋转的同时做颈部小范围旋转"]},{"n":"有氧运动和休闲活动回归","s":"每周3-5次","r":"每次20-40分钟","d":"逐步回归中低强度有氧运动，建立终身的颈椎保健运动习惯","st":["推荐运动：游泳(仰泳、蛙泳优先)、快走、椭圆机、固定自行车","运动前充分热身5-10分钟，特别关注颈后肌群的动态拉伸","运动强度RPE 11-13，运动中每10分钟检查一次颈部姿势","避免运动：蝶泳、大重量深蹲(杠铃压迫颈椎后方)、搏击类","运动后做颈后肌群的静态拉伸放松"]}]}],"warnings":["C5神经根麻痹是最具特征性的术后并发症(发生率5-8%)，表现为三角肌和/或肱二头肌无力，多在术后1-7天出现，多数3-6个月内恢复但恢复不完全者占10-20%","轴性颈痛是椎板成形术后最常见的长期并发症(发生率3 const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const REGION_ORDER = Object.entries(DATA.region_config).sort((a,b)=>a[1].order-b[1].order).map(e=>e[0]);
const SUBS = Object.entries(DATA.sub_config).sort((a,b)=>a[1].order-b[1].order);
const PROG_KEY = 'zjs_rehab_progress_v5';

/* ---------- 进度存储 ---------- */
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(PROG_KEY)||'{}'); }catch(e){ progress={}; }
function saveProgress(){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(progress)); }catch(e){} }
function exKey(region,cat,did,ph,exi){ return [region,cat,did,ph,exi].join('|'); }
function isChecked(k){ return !!(progress[k]); }
function diseaseStats(region,cat,did){
  const dz = getDisease(region,cat,did); if(!dz) return {total:0,done:0};
  let total=0, done=0;
  (dz.phases||[]).forEach(p=>(p.ex||[]).forEach((e,i)=>{
    total++;
    if(isChecked(exKey(region,cat,did,p.n,i))) done++;
  }));
  return {total,done};
}
function regionProgress(region){
  let total=0, done=0;
  const r=DATA.regions[region];
  SUBS.forEach(([sk,sc])=>{
    if(sk!=='diseases') return;
    Object.keys((sc.children)||{}).forEach(cat=>{
      Object.keys((r.diseases||{})[cat]||{}).forEach(did=>{
        const s=diseaseStats(region,cat,did); total+=s.total; done+=s.done;
      });
    });
  });
  return {total,done};
}
function overallProgress(){
  let total=0, done=0;
  REGION_ORDER.forEach(r=>{ const p=regionProgress(r); total+=p.total; done+=p.done; });
  return {total,done};
}

/* ---------- 数据访问 ---------- */
function getDisease(region,cat,did){
  const d = (DATA.regions[region]?.diseases?.[cat]||{})[did];
  if(d) return d;
  const meta = DATA.disease_meta[[region,cat,did].join('.')];
  return meta ? {name:meta.name, alias:meta.alias, phases:[]} : null;
}
function regionName(r){ return (DATA.region_config[r]||{}).name||r; }
function regionIcon(r){ return (DATA.region_config[r]||{}).icon||'🦴'; }
function catName(c){ return (DATA.sub_config.diseases.children[c]||{}).name||c; }
function catIcon(c){ return (DATA.sub_config.diseases.children[c]||{}).icon||'🏥'; }

/* ---------- 状态 ---------- */
let state = { region:null, sub:null, cat:null, disease:null };
/* 持久化侧边栏展开状态 */
const OPEN_KEY='zjs_rehab_open_v5';
let openState={r:{},d:{}};
try{ openState=JSON.parse(localStorage.getItem(OPEN_KEY)||'{"r":{},"d":{}}'); }catch(e){}
function saveOpen(){ try{ localStorage.setItem(OPEN_KEY, JSON.stringify(openState)); }catch(e){} }

/* ================================================================
   侧边栏渲染
   ================================================================ */
function renderSidebar(){
  const nav = $('#sidebarNav');
  nav.innerHTML = REGION_ORDER.map(r=>{
    const cfg=DATA.region_config[r];
    const subs = SUBS.map(([sk,sc])=>{
      if(sk!=='diseases'){
        const active = state.region===r && state.sub===sk && !state.cat;
        return `<button class="sub-toggle ${active?'active':''}" onclick="navTo('${r}','${sk}')">
          <span class="sicon">${sc.icon}</span>${sc.name}</button>`;
      }
      // 疾病：可展开子分类
      const dk='d-'+r+'-diseases';
      const children = Object.entries(sc.children).sort((a,b)=>a[1].order-b[1].order).map(([cat,cc])=>{
        const list = Object.entries(DATA.regions[r].diseases[cat]||{});
        const items = list.map(([did,dz])=>{
          const active = state.region===r&&state.sub==='diseases'&&state.cat===cat&&state.disease===did;
          const st = diseaseStats(r,cat,did);
          const pct = st.total? Math.round(st.done/st.total*100):0;
          return `<button class="disease-link ${active?'active':''}" onclick="navTo('${r}','diseases','${cat}','${did}')" title="${esc(dz.name)}">${esc(dz.name)}${pct===100?' ✓':''}</button>`;
        }).join('');
        return `<div class="disease-group ${openState.d[dk+'-'+cat]?'open':''}" id="dg-${r}-${cat}">
          <button class="disease-toggle ${state.region===r&&state.cat===cat&&!state.disease?'active':''}" onclick="toggleDiseaseGroup('${r}','${cat}')">
            <svg class="arrow" style="width:10px;height:10px" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            <span>${cc.icon}</span>${cc.name}<span class="cnt">${list.length}</span>
          </button>
          <div class="disease-list">${items}</div>
        </div>`;
      }).join('');
      return `<div class="disease-group ${openState.d[dk]?'open':''}" id="dg-${r}-diseases">
        <button class="disease-toggle ${state.region===r&&state.sub==='diseases'&&!state.cat?'active':''}" onclick="toggleGroup('${r}','diseases')">
          <svg class="arrow" style="width:10px;height:10px" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          <span>${sc.icon}</span>${sc.name}</button>
        <div class="disease-list" style="padding-left:12px">${children}</div>
      </div>`;
    }).join('');
    const prog = regionProgress(r);
    const pct = prog.total? Math.round(prog.done/prog.total*100):0;
    return `<div class="region-item ${openState.r[r]?'open':''}" id="ri-${r}">

}
function toggleRegion(r){

function toggleGroup(r,sk){

function toggleDiseaseGroup(r,cat){

function openSidebarPath(region,cat){

function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); }
function toggleSidebar(){ $('#sidebar').classList.toggle('open'); $('#backdrop').classList.toggle('show'); }

/* ================================================================
   导航
   ================================================================ */
function navTo(region, sub, cat, disease){
  state = { region, sub, cat:cat||null, disease:disease||null };
  openSidebarPath(region, cat);
  render();
  closeSidebar();
  $('#contentArea').scrollTop=0;
  document.querySelector('.content').scrollTop=0;
  window.scrollTo(0,0);
}
function render(){
  renderSidebar();
  renderBreadcrumb();
  const c = $('#contentArea');
  if(!state.region){ c.innerHTML = homeHTML(); return; }
  // tab 导航
  const tabs = SUBS.map(([sk,sc])=>{
    const active = state.sub===sk;
    const onclick = sk==='diseases' ? `navTo('${state.region}','diseases')` : `navTo('${state.region}','${sk}')`;
    return `<button class="tab-btn ${active?'active':''}" onclick="${onclick}">${sc.icon} ${sc.name}</button>`;
  }).join('');
  let body='';
  if(state.sub==='anatomy') body = anatomyHTML(state.region);
  else if(state.sub==='assessment') body = assessmentHTML(state.region);
  else if(state.sub==='diseases'){
    if(state.disease) body = diseaseDetailHTML(state.region,state.cat,state.disease);
    else if(state.cat) body = diseaseListHTML(state.region,state.cat);
    else body = diseaseCatHTML(state.region);
  }
  c.innerHTML = `<div class="tab-nav">${tabs}</div>` + body;
}
function renderBreadcrumb(){
  const b=$('#breadcrumb');
  if(!state.region){ b.innerHTML='<b>选择康复部位</b>'; return; }
  let html = `<b>${regionIcon(state.region)} ${regionName(state.region)}</b>`;
  const sc = DATA.sub_config[state.sub];
  if(sc){
    html += `<span class="sep">›</span>`;
    if(state.disease){
      html += `<a href="javascript:navTo('${state.region}','${state.sub}')" style="color:var(--accent);text-decoration:none">${sc.name}</a>`;
      if(state.cat){
        html += `<span class="sep">›</span><a href="javascript:navTo('${state.region}','${state.sub}','${state.cat}')" style="color:var(--accent);text-decoration:none">${catName(state.cat)}</a>`;
        html += `<span class="sep">›</span><span class="cur">${esc(getDisease(state.region,state.cat,state.disease)?.name||'')}</span>`;
      } else {
        html += `<span class="cur">${sc.name}</span>`;
      }
    } else if(state.cat){
      html += `<a href="javascript:navTo('${state.region}','${state.sub}')" style="color:var(--accent);text-decoration:none">${sc.name}</a><span class="sep">›</span><span class="cur">${catName(state.cat)}</span>`;
    } else {
      html += `<span class="cur">${sc.name}</span>`;
    }
  }
  b.innerHTML = html;
}

function tbl(head, rows){
  return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

function anatomyHTML(region){
  const a = DATA.regions[region].anatomy||{};
  const rn = regionName(region), icon=regionIcon(region);
  let out = `<div class="page-head">
    <h2>${icon} ${rn} · 解剖结构</h2>
    <div class="ph-sub">了解${rn}的骨骼、关节、肌肉、神经和正常关节活动度，为康复训练提供解剖学基础。</div></div>`;
  const sec = (title,count,inner)=>`<div class="card"><div class="card-head"><span class="cicon">📐</span><h3>${title}</h3><span class="cnt-tag">${count}</span></div><div class="card-body">${inner}</div></div>`;
  if(a.bones?.length) out += sec('🦴 骨骼', a.bones.length, tbl(['中文名','英文名','描述'], a.bones.map(b=>[esc(b.cn),`<span class="en">${esc(b.en)}</span>`,esc(b.desc)])));
  if(a.joints?.length) out += sec('🔗 关节', a.joints.length, tbl(['中文名','英文名','类型','描述'], a.joints.map(j=>[esc(j.cn),`<span class="en">${esc(j.en)}</span>`,`<span class="tag tag-purple">${esc(j.type)}</span>`,esc(j.desc)])));
  if(a.muscles?.length) out += sec('💪 肌肉', a.muscles.length, tbl(['中文名','英文名','功能','神经支配','肌群'], a.muscles.map(m=>[esc(m.cn),`<span class="en">${esc(m.en)}</span>`,esc(m.action),esc(m.nerve),`<span class="tag tag-blue">${esc(m.group)}</span>`])));
  if(a.nerves?.length) out += sec('🧠 神经', a.nerves.length, tbl(['中文名','英文名','神经根','功能'], a.nerves.map(n=>[esc(n.cn),`<span class="en">${esc(n.en)}</span>`,`<span class="tag tag-orange">${esc(n.roots)}</span>`,esc(n.function)])));
  if(a.rom?.length) out += sec('📏 正常关节活动度 (ROM)', a.rom.length, tbl(['活动','中文','正常范围'], a.rom.map(r=>[`<span class="en">${esc(r.movement)}</span>`,esc(r.cn),`<b style="color:var(--accent-d)">${esc(r.normal)}</b>`])));
  return out;
}

/* ---------- 评定图示 SVG 库 ---------- */
const _C='#33475b', _F='#9db3c8', _R='#ef4444', _M='#3b82f6', _GD='#c9daf2';
let _n=0;
const L=(x1,y1,x2,y2,c=_C,w=6.5,o=1,dash)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
const H=(x,y,r=6,c=_C)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const J=(x,y)=>`<circle cx="${x}" cy="${y}" r="3" fill="#fff" stroke="${_C}" stroke-width="1.6"/>`;
const Q=(d,c=_C,w=6.5,o=1)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`;
function _arcP(cx,cy,r,a1,a2){
  const R=d=>d*Math.PI/180;
  const x1=cx+r*Math.cos(R(a1)),y1=cy+r*Math.sin(R(a1)),x2=cx+r*Math.cos(R(a2)),y2=cy+r*Math.sin(R(a2));
  const large=Math.abs(a2-a1)>180?1:0, sweep=a2>a1?1:0;
  return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} ${sweep} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}
function _wrap(inner){
  _n++;
  const a='ra'+_n, b='ma'+_n;
  return `<svg class="ill-svg" viewBox="0 0 120 92"><defs>
    <marker id="${a}" markerWidth="6" markerHeight="6" refX="6.5" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0L8 4L0 8z" fill="${_R}"/></marker>
    <marker id="${b}" markerWidth="6" markerHeight="6" refX="6.5" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0L8 4L0 8z" fill="${_M}"/></marker>
  </defs>${inner}</svg>`;
}
function illSVG(key,opts){
  opts=opts||{};
  _n++;
  const mk={a:'ra'+_n, b:'ma'+_n};
  const fn=POSES[key];
  if(!fn) return _wrap(L(30,70,90,70,_GD,4)+H(60,30,10,_GD));
  return _wrap(fn(mk,opts));
}
const RA=(mk,x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${_R}" stroke-width="3" stroke-linecap="round" marker-end="url(#${mk.a})"/>`;
const MArc=(mk,cx,cy,r,a1,a2)=>`<path d="${_arcP(cx,cy,r,a1,a2)}" fill="none" stroke="${_M}" stroke-width="2.6" stroke-linecap="round" marker-end="url(#${mk.b})"/>`;
const RArc=(mk,cx,cy,r,a1,a2)=>`<path d="${_arcP(cx,cy,r,a1,a2)}" fill="none" stroke="${_R}" stroke-width="2.8" stroke-linecap="round" marker-end="url(#${mk.a})"/>`;
const D=(x1,y1,x2,y2)=>L(x1,y1,x2,y2,_F,5,.6,'4 5');   // 虚线起始位
const PALM=(x,y)=>`<rect x="${x}" y="${y}" width="30" height="28" rx="7" fill="#e3edf9" stroke="${_C}" stroke-width="2.4"/>`;

/* 姿态绘制函数：所有动作统一「虚线起始位 → 蓝色轨迹 → 测试位 → 红色阻力」 */
const POSES={
  /* 肩外展（正面） */
  shAbd(mk,o){
    let s=H(60,12)+L(60,19,60,46)+L(60,46,52,76)+L(60,46,68,76)+L(60,25,47,41,_F);
    if(o.rom){
      s+=D(60,25,69,44);
      s+=(o.rev? L(60,25,92,25)+MArc(mk,60,25,27,0,55) : L(60,25,92,25)+MArc(mk,60,25,27,80,0));
    } else {
      s+=D(60,25,67,45)+L(60,25,92,25)+MArc(mk,60,25,27,72,0)+RA(mk,96,25,110,25);
    }
    return s;
  },
  /* 肩前屈（侧面，ROM） */
  shFlex(mk){
    return H(42,12)+L(42,19,42,50)+L(42,50,38,78)+L(42,50,50,78)
      +D(42,25,52,46)+L(42,25,74,16)+MArc(mk,42,25,26,75,-8);

  /* 肩后伸（侧面，ROM） */
  shExt(mk){

  emptyCan(mk){

      +D(60,25,68,46)+L(60,25,88,10)+MArc(mk,60,25,27,75,-55)+RA(mk,91,7,99,17);
  },
  /* Lift-off（肩胛下肌，侧视） */
  liftOff(mk){

      +D(46,38,58,50)
      +L(46,38,40,54)+MArc(mk,46,38,17,55,125)+RA(mk,38,56,30,62);

  /* 推墙（前锯肌） */
  pushWall(mk){

  /* 肩内外旋 */
  shRot(mk,o){

  /* 肘屈（侧） */
  elbFlex(mk,o){

  elbExt(mk){

  foreRot(mk,o){

  /* 腕部运动 dir: flex/ext/rad/uln */
  wrist(mk,o){

    const end={flex:[92,60],ext:[92,36],rad:[93,42],uln:[93,56]}[o.dir];
    const na={flex:0,ext:0,rad:0,uln:0}[o.dir];

/* ---------- MMT 姿态映射 ---------- */
function mmtPose(s){
  const k=(s.muscle||'')+' '+(s.test||'');
  if(/Supraspinatus|Empty Can/i.test(k)) return ['emptyCan',{}];
  if(/Infraspinatus|Teres Minor|Hornblower/i.test(k)) return ['shRot',{ir:false}];
  if(/Subscapularis|Lift-off|Belly/i.test(k)) return ['liftOff',{}];
  if(/Serratus|wall push|前伸/i.test(k)) return ['pushWall',{}];
  if(/Deltoid|肩外展/.test(k)) return ['shAbd',{}];
  if(/Pronator|旋前/.test(k)) return ['foreRot',{pr:true}];
  if(/Supinator|旋后/.test(k)) return ['foreRot',{pr:false}];
  if(/Flexor Carpi|掌屈/.test(k)) return ['wrist',{dir:/尺偏/.test(k)?'uln':'flex'}];
  if(/Extensor Carpi|腕背伸/.test(k)) return ['wrist',{dir:/尺偏/.test(k)?'uln':'ext'}];
  if(/Abductor Pollicis|拇指外展/.test(k)) return ['thumbAbd',{}];
  if(/Opponens|对掌/.test(k)) return ['thumbOpp',{}];
  if(/Froment|Adductor Pollicis|夹纸/.test(k)) return ['paper',{}];
  if(/Interosseous|手指外展|Finger Abduct/i.test(k)) return ['fingerAbd',{}];
  if(/DIP|远端指间/.test(k)) return ['finger',{lvl:'dip'}];
  if(/PIP|近端指间/.test(k)) return ['finger',{lvl:'pip'}];
  if(/Flexor Digitorum|指屈|屈指/.test(k)) return ['finger',{lvl:'mcp'}];
  if(/Gluteus Medius|髋外展/.test(k)) return ['hipAbd',{}];
  if(/Gluteus Maximus|髋后伸/.test(k)) return ['hipExt',{}];
  if(/Iliopsoas|Hip Flexor|髋屈曲/.test(k)) return ['hipFlex',{}];
  if(/Adductor|内收抗阻/.test(k)) return ['hipAbd',{add:true}];
  if(/Hip External Rotator|髋外旋/.test(k)) return ['hipER',{}];
  if(/Hamstring|膝屈曲/.test(k)) return ['kneeFlex',{}];
  if(/Quadriceps|膝伸直|Knee Extensor/i.test(k)) return ['kneeExt',{}];
  if(/Gastrocnemius|提踵|Plantarflexor/i.test(k)) return ['heelRaise',{}];
  if(/Tibialis Anterior|踝背伸|Dorsiflexor/i.test(k)) return ['ankle',{pf:false}];
  if(/Tibialis Posterior|足内翻/.test(k)) return ['footTilt',{ev:false}];
  if(/Peroneus|足外翻/.test(k)) return ['footTilt',{ev:true}];
  if(/Hallucis|拇趾背伸|Toe Extensor/i.test(k)) return ['toeExt',{}];
  if(/Sternocleidomastoid|头旋转/.test(k)) return ['neckRot',{}];
  if(/Erector Spinae|躯干后伸/.test(k)) return ['trunkExt',{}];
  if(/C5/.test(k)) return ['shAbd',{}];
  if(/C6/.test(k)) return ['elbFlex',{}];
  if(/C7/.test(k)) return ['elbExt',{}];
  if(/C8/.test(k)) return ['finger',{lvl:'dip'}];
  if(/T1/.test(k)) return ['fingerAbd',{}];
  if(/L2/.test(k)) return ['hipFlex',{}];
  if(/L3/.test(k)) return ['kneeExt',{}];
  if(/L4/.test(k)) return ['ankle',{pf:false}];
  if(/L5/.test(k)) return ['toeExt',{}];
  if(/S1/.test(k)) return ['heelRaise',{}];
  if(/肘屈/.test(k)) return ['elbFlex',{}];
  if(/肘伸/.test(k)) return ['elbExt',{}];
  return null;
}

/* ---------- ROM 姿态映射 ---------- */
function romPose(mv,region){
  const m=(mv||'').toLowerCase();
  const spine = region==='cervical'||region==='lumbar';
  if(/horizontal abduction/.test(m)) return ['horiz',{rom:true,ab:true}];
  if(/horizontal adduction/.test(m)) return ['horiz',{rom:true,ab:false}];
  if(/internal rotation/.test(m)) return [/flexed/.test(m)?'hipER':'shRot',{rom:true,ir:true}];
  if(/external rotation/.test(m)) return [/flexed/.test(m)?'hipER':'shRot',{rom:true,ir:false}];
  if(/dorsiflexion/.test(m)) return ['ankle',{rom:true,pf:false}];
  if(/plantarflexion/.test(m)) return ['ankle',{rom:true,pf:true}];
  if(/inversion/.test(m)) return ['footTilt',{rom:true,ev:false}];
  if(/eversion/.test(m)) return ['footTilt',{rom:true,ev:true}];
  if(/radial deviation/.test(m)) return ['wrist',{rom:true,dir:'rad'}];
  if(/ulnar deviation/.test(m)) return ['wrist',{rom:true,dir:'uln'}];
  if(/supination/.test(m)) return ['foreRot',{rom:true,pr:false}];
  if(/pronation/.test(m)) return ['foreRot',{rom:true,pr:true}];
  if(/circumduction/.test(m)) return ['circ',{}];
  if(/thumb opposition|对掌/.test(m)) return ['thumbOpp',{}];
  if(/finger abduction|指外展/.test(m)) return ['fingerAbd',{rom:true}];
  if(/thumb/.test(m)&&/flexion/.test(m)) return ['finger',{lvl:'mcp'}];
  if(/mcp flexion|pip flexion|dip flexion/.test(m)) return ['finger',{rom:true,lvl:/mcp/.test(m)?'mcp':(/pip/.test(m)?'pip':'dip')}];
  if(/flexion/.test(m)){
    if(spine) return ['spineFlex',{rom:true,ext:false}];
    if(region==='knee') return ['kneeFlex',{rom:true}];
    if(region==='hip') return ['hipFlex',{rom:true}];
    if(region==='elbow') return ['elbFlex',{rom:true}];
    if(region==='wrist'||region==='hand') return ['wrist',{rom:true,dir:'flex'}];
    if(region==='ankle') return ['ankle',{rom:true,pf:false}];
    return ['shFlex',{}];
  }
  if(/extension|hyperextension/.test(m)){
    if(spine) return ['spineFlex',{rom:true,ext:true}];
    if(region==='knee') return ['kneeExt',{rom:true}];
    if(region==='hip') return ['hipExt',{rom:true}];
    if(region==='elbow') return ['elbExt',{}];
    if(region==='wrist'||region==='hand') return ['wrist',{rom:true,dir:'ext'}];
    if(/thumb|mcp|pip|dip|finger/.test(m)) return ['finger',{rom:true,rev:true,lvl:'mcp'}];
    return ['shExt',{}];
  }
  if(/abduction/.test(m)){
    if(region==='hip') return ['hipAbd',{rom:true}];
    if(spine) return ['spineLat',{}];
    return ['shAbd',{rom:true}];
  }
  if(/adduction/.test(m)){
    if(region==='hip') return ['hipAbd',{rom:true,add:true}];
    return ['shAbd',{rom:true,rev:true}];
  }
  if(/lateral flexion/.test(m)) return ['spineLat',{}];
  if(/rotation/.test(m)) return [region==='cervical'?'neckRot':'spineRot',{rom:true}];
  if(/protraction/.test(m)) return ['scap',{rom:true,ret:false}];
  if(/retraction/.test(m)) return ['scap',{rom:true,ret:true}];
  return null;
}

    out += `<div class="page-head" style="margin-top:26px"><h2 style="font-size:16px">🧪 特殊试验</h2></div><div class="st-grid">` +

        <div class="cc-icon">${cc.icon}</div>
        <b>${cc.name}</b>
        <div class="cc-sub">${list.length} 种疾病</div>
        <span class="cc-link">查看详情 →</span>
      </div>`;
    }).join('')}</div>`;
}
function diseaseListHTML(region,cat){
  const rn=regionName(region), icon=regionIcon(region);
  const list=Object.entries(DATA.regions[region].diseases[cat]||{});
  return `<div class="page-head">
      <h2>${icon} ${rn} · ${catIcon(cat)} ${catName(cat)}</h2>
      <div class="ph-sub">共 ${list.length} 种疾病，点击查看分期康复方案。</div></div>
    <div class="d-grid">${list.map(([did,dz])=>{
      const st=diseaseStats(region,cat,did);
      const pct=st.total?Math.round(st.done/st.total*100):0;
      return `<div class="d-card" onclick="navTo('${region}','diseases','${cat}','${did}')">
        <b>${esc(dz.name)}</b>
        ${dz.alias?`<div class="alias">别名：${esc(dz.alias)}</div>`:''}
        <div class="d-sub">${esc(dz.sub||'')}</div>
        <div class="d-tags">
          ${(dz.tags||[]).map(t=>`<span class="tag tag-${({danger:'red',warn:'orange',accent:'blue',ok:'green'}[t.c]||'gray')}">${esc(t.t)}</span>`).join('')}
          ${st.total?`<span class="tag ${pct===100?'tag-green':'tag-gray'}" style="margin-left:auto">进度 ${st.done}/${st.total}</span>`:''}
        </div>
      </div>`;
    }).join('')}</div>`;
}

/* ---------- 病种详情 ---------- */
function diseaseDetailHTML(region,cat,did){
  const dz=getDisease(region,cat,did);
  if(!dz) return `<div class="empty-tip"><div class="e-icon">🤔</div><p>未找到该疾病数据</p></div>`;
  const icon=regionIcon(region);
  const op = overallProgress();
  let out = `<div class="page-head">
    <h2>${icon} ${esc(dz.name)} ${dz.alias?`<span class="tag tag-gray">${esc(dz.alias)}</span>`:''}</h2>
    <div class="ph-sub">${esc(dz.sub||'')}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
      ${(dz.tags||[]).map(t=>`<span class="tag tag-${({danger:'red',warn:'orange',accent:'blue',ok:'green'}[t.c]||'gray')}">${esc(t.t)}</span>`).join('')}
    </div></div>`;

  if(dz.dx?.length){
    out += `<div class="dx-box"><h4>🔍 诊断要点</h4><div class="dx-list">
      ${dz.dx.map(d=>`<div class="dx-item"><span class="dot"></span><span>${esc(d)}</span></div>`).join('')}</div></div>`;
  }

  const st = diseaseStats(region,cat,did);
  (dz.phases||[]).forEach(p=>{
    const pd = p.ex.reduce((n,_,i)=>n+(isChecked(exKey(region,cat,did,p.n,i))?1:0),0);
    const pct = p.ex.length? Math.round(pd/p.ex.length*100):0;
    const ring = progRing(pct);
    out += `<div class="phase-card">
      <div class="phase-head">
        <div class="phase-num">${p.n}</div>
        <div><b>第 ${p.t} 阶段</b><div class="ph-dur">${esc(p.d)}</div></div>
        <div class="spacer"></div>
        <div class="prog-wrap">${ring}<div class="prog-txt"><b>${pd}/${p.ex.length}</b> 动作<br>已掌握</div></div>
      </div>
      <div class="phase-goal"><span class="glabel">阶段目标</span><span>${esc(p.g)}</span></div>
      ${p.ex.map((e,i)=>{
        const k=exKey(region,cat,did,p.n,i);
        const checked=isChecked(k);
        return `<div class="ex-item ${checked?'done-ex':''}">
          <div class="ex-head">
            <div class="ex-check ${checked?'done':''}" onclick="toggleEx(this,'${k.replace(/'/g,"\\'")}')" data-key="${esc(k)}">
              <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <div class="ex-main">
              <div class="ex-title"><b onclick="toggleExFromTitle('${esc(k)}')">${esc(e.n)}</b>
                <div class="ex-meta">
                  <span class="tag tag-blue">⏱ ${esc(e.s)}</span>
                  <span class="tag tag-purple">🔁 ${esc(e.r)}</span>
                </div>
              </div>
              <div class="ex-desc">${esc(e.d)}</div>
              ${e.st?.length?`<div class="ex-steps"><div class="st-label">动作要领</div><ul>${e.st.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  });

  if(dz.warnings?.length){
    out += `<div class="warn-box"><h4>⚠️ 注意事项</h4><ul>${dz.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`;
  }
  if(dz.tips?.length){
    out += `<div class="tips-box"><h4>💡 康复小贴士</h4><ul>${dz.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`;
  }
  return out;
}
function progRing(pct){
  const r=14, c=2*Math.PI*r, off=c*(1-pct/100);
  const color = pct===100 ? '#10b981' : (pct>0?'#3b82f6':'#dce6f5');
  return `<svg class="prog-ring" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="#e8eff9" stroke-width="4"/>
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 17 17)"/>
    <text x="17" y="20.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5b6b7c">${pct}%</text>
  </svg>`;
}

/* ---------- 进度勾选 ---------- */
function toggleEx(el, key){
  progress[key] = !progress[key];
  if(!progress[key]) delete progress[key];
  saveProgress();
  el.classList.toggle('done', !!progress[key]);
  el.closest('.ex-item')?.classList.toggle('done-ex', !!progress[key]);
  render(); // 更新侧边栏百分比与阶段环
}
function toggleExFromTitle(key){
  progress[key] = !progress[key];
  if(!progress[key]) delete progress[key];
  saveProgress();
  render();
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2000);
}
function askReset(){ $('#confirmMask').classList.add('show'); }
function hideConfirm(){ $('#confirmMask').classList.remove('show'); }
function doReset(){
  progress={}; saveProgress(); hideConfirm(); render(); toast('✓ 进度已重置');
}

/* ---------- 初始化 ---------- */
render();
</script>
</body>
</html>
